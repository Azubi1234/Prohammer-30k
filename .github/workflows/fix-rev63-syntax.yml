name: Fix Revision 63 syntax
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/fix_rev63_syntax.py'
      - '.github/workflows/fix-rev63-syntax.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/fix_rev63_syntax.py
      - run: python -m py_compile .github/build/rev63_space_wolves_full.py
      - name: Commit syntax fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build/rev63_space_wolves_full.py
          git commit -m 'Fix Revision 63 Space Wolves script syntax'
          git push
