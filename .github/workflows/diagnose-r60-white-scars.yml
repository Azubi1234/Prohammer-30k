name: Diagnose Revision 60 White Scars
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/r60_diag_white_scars.py'
      - '.github/workflows/diagnose-r60-white-scars.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/r60_diag_white_scars.py
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-r60-white-scars-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Diagnose Revision 60 White Scars'
            git push
          fi
