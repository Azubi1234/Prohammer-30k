name: Apply Revision 61 psychic and White Scars changes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/rev61_psychic_white_scars.py'
      - '.github/workflows/apply-r61-psychic-white-scars.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply psychic and White Scars changes
        run: python .github/build/rev61_psychic_white_scars.py
      - name: Run permanent unit-size audit
        run: python .github/build/r56_audit_all_unit_sizes.py
      - name: Verify revision and inspection
        run: |
          grep -q 'dataRevision="61"' index.xml
          grep -q 'dataRevision="29"' index.xml
          test -f inspection-r61-psychic-and-white-scars.txt
          cat inspection-r61-psychic-and-white-scars.txt
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-r61-psychic-and-white-scars.txt inspection-r56-all-unit-sizes.txt
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Revision 61: implement psychic disciplines and White Scars fixes'
            git push
          fi
