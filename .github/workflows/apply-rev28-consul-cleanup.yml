name: Apply Revision 28 consul cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-rev28-consul-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch catalogue
        shell: python
        run: |
          import copy
          import xml.etree.ElementTree as ET
          from pathlib import Path

          CAT = Path('Legiones Astartes.cat')
          NS = 'http://www.battlescribe.net/schema/catalogueSchema'
          ET.register_namespace('', NS)
          T = lambda x: f'{{{NS}}}{x}'

          tree = ET.parse(CAT)
          root = tree.getroot()
          assert root.get('id') == 'cat-30a0-30b0-30c0-0001'
          assert root.get('revision') in {'27','28'}
          assert root.get('gameSystemRevision') == '12'

          # ---------- generic XML helpers ----------
          def by_id(eid):
              for e in root.iter():
                  if e.get('id') == eid:
                      return e
              return None

          def first_by_name(name, tag=None):
              for e in root.iter(T(tag)) if tag else root.iter():
                  if e.get('name') == name:
                      return e
              return None

          ORDER = {
              'selectionEntry': ['modifiers','modifierGroups','constraints','profiles','rules','infoGroups','categoryLinks','selectionEntries','selectionEntryGroups','entryLinks','costs'],
              'selectionEntryGroup': ['modifiers','modifierGroups','constraints','selectionEntries','selectionEntryGroups','entryLinks'],
              'sharedSelectionEntry': ['modifiers','modifierGroups','constraints','profiles','rules','infoGroups','categoryLinks','selectionEntries','selectionEntryGroups','entryLinks','costs'],
          }

          def ensure_container(parent, name):
              found = parent.find(T(name))
              if found is not None:
                  return found
              elem = ET.Element(T(name))
              ptag = parent.tag.split('}')[-1]
              order = ORDER.get(ptag, [])
              if name in order:
                  nidx = order.index(name)
                  children = list(parent)
                  insert_at = len(children)
                  for i, c in enumerate(children):
                      ctag = c.tag.split('}')[-1]
                      if ctag in order and order.index(ctag) > nidx:
                          insert_at = i
                          break
                  parent.insert(insert_at, elem)
              else:
                  parent.append(elem)
              return elem

          def remove_children_by_prefix(parent, container_name, prefix):
              cont = parent.find(T(container_name))
              if cont is None:
                  return
              for c in list(cont):
                  if (c.get('id') or '').startswith(prefix):
                      cont.remove(c)

          def add_rule(parent, rid, name, text):
              rules = ensure_container(parent, 'rules')
              old = by_id(rid)
              if old is not None:
                  old.set('name', name)
                  d = old.find(T('description'))
                  if d is None:
                      d = ET.SubElement(old, T('description'))
                  d.text = text
                  return old
              r = ET.SubElement(rules, T('rule'), {'id':rid,'name':name})
              ET.SubElement(r, T('description')).text = text
              return r

          def add_cost(parent, cid, value):
              costs = ensure_container(parent, 'costs')
              for c in costs.findall(T('cost')):
                  if c.get('name') == 'pts':
                      c.set('value', str(value)); return
              ET.SubElement(costs, T('cost'), {'name':'pts','typeId':'points','value':str(value)})

          def add_link(parent, lid, name, target, cost=None, default=None):
              links = ensure_container(parent, 'entryLinks')
              for e in list(links):
                  if e.get('id') == lid:
                      links.remove(e)
              attrs = {'id':lid,'name':name,'hidden':'false','collective':'false','import':'true','targetId':target,'type':'selectionEntry'}
              if default is not None:
                  attrs['defaultAmount'] = str(default)
              e = ET.SubElement(links, T('entryLink'), attrs)
              if cost is not None:
                  costs = ET.SubElement(e, T('costs'))
                  ET.SubElement(costs, T('cost'), {'name':'pts','typeId':'points','value':str(cost)})
              return e

          def add_upgrade(parent, uid, name, cost=0, rule_text=None):
              ses = ensure_container(parent, 'selectionEntries')
              for e in list(ses):
                  if e.get('id') == uid:
                      ses.remove(e)
              e = ET.SubElement(ses, T('selectionEntry'), {'id':uid,'name':name,'hidden':'false','collective':'false','import':'true','type':'upgrade'})
              if rule_text:
                  add_rule(e, uid+'-rule', name, rule_text)
              if cost:
                  add_cost(e, uid+'-cost', cost)
              return e

          def add_group(parent, gid, name, minv=None, maxv=None):
              groups = ensure_container(parent, 'selectionEntryGroups')
              for g in list(groups):
                  if g.get('id') == gid:
                      groups.remove(g)
              g = ET.SubElement(groups, T('selectionEntryGroup'), {'id':gid,'name':name,'hidden':'false','collective':'false','import':'true'})
              if minv is not None or maxv is not None:
                  cons = ensure_container(g, 'constraints')
                  if minv is not None:
                      ET.SubElement(cons, T('constraint'), {'type':'min','value':str(minv),'field':'selections','scope':'parent','shared':'true','id':gid+'-min','includeChildSelections':'false'})
                  if maxv is not None:
                      ET.SubElement(cons, T('constraint'), {'type':'max','value':str(maxv),'field':'selections','scope':'parent','shared':'true','id':gid+'-max','includeChildSelections':'false'})
              return g

          def add_group_choice(group, cid, name, text=None, cost=0):
              return add_upgrade(group, cid, name, cost, text)

          def hide_unless(entry, modifier_id, child_id, scope='parent'):
              mods = ensure_container(entry, 'modifiers')
              m = ET.SubElement(mods, T('modifier'), {'type':'set','value':'true','field':'hidden'})
              conds = ET.SubElement(m, T('conditions'))
              ET.SubElement(conds, T('condition'), {'type':'lessThan','value':'1','field':'selections','scope':scope,'childId':child_id,'shared':'true','includeChildSelections':'true','includeChildForces':'false'})

          # ---------- shared/general rules and wargear ----------
          shared = root.find(T('sharedSelectionEntries'))
          if shared is None:
              shared = ET.SubElement(root, T('sharedSelectionEntries'))

          def shared_upgrade(uid, name, text):
              e = by_id(uid)
              if e is None:
                  e = ET.SubElement(shared, T('selectionEntry'), {'id':uid,'name':name,'hidden':'false','collective':'false','import':'true','type':'upgrade'})
              add_rule(e, uid+'-rule', name, text)
              return e

          crozius = shared_upgrade('gear-consul-crozius', 'Crozius Arcanum', 'Counts as a Power Weapon.')
          rosarius = shared_upgrade('gear-consul-rosarius', 'Rosarius', 'Grants a 4+ Invulnerable Save. A Rosarius does not count towards the normal army limit on Iron Halos.')
          servo = shared_upgrade('gear-consul-servo-arm', 'Servo-Arm', 'Counts as a Power Fist attack resolved separately from the bearer’s normal Attacks. A model with a Servo-Arm also receives +1 to Battlesmith repair rolls where applicable.')
          cognis = shared_upgrade('gear-consul-cognis-signum', 'Cognis Signum', 'A Master of Signals equipped with a Cognis Signum coordinates targeting and reserve telemetry. Use the Master of Signals rules in this army list, including the Nuncio Vox interaction and Targeting Matrix where applicable.')
          aether = shared_upgrade('gear-consul-aether-maul', 'Aether-shock Maul', 'Counts as a Power Weapon. Against Psykers and models with the Daemon special rule, it always wounds on a 2+.')
          cortex = shared_upgrade('gear-consul-cortex-controller', 'Cortex Controller', 'Friendly Battle-Automata within 6" automatically pass Command Uplink or equivalent control tests.')
          designator = shared_upgrade('gear-consul-cortex-designator', 'Cortex Designator', 'When the Praevian scores one or more successful To Hit rolls with a shooting weapon against an enemy unit, his attached Battle-Automata gain Preferred Enemy against that unit until the end of the current player turn.')

          # ---------- remove incorrectly-global Force Weapon access ----------
          for host_id in ('hq-centurion','hq-praetor'):
              host = by_id(host_id)
              if host is None: continue
              for cont in host.iter(T('entryLinks')):
                  for e in list(cont):
                      if e.get('targetId') == 'gear-hq-force' or e.get('name') == 'Force Weapon':
                          cont.remove(e)

          # ---------- Chaplain ----------
          chap = by_id('hq-consul-chaplain')
          assert chap is not None
          add_link(chap, 'rev28-chap-crozius', 'Crozius Arcanum', 'gear-consul-crozius', default=1)
          add_link(chap, 'rev28-chap-rosarius', 'Rosarius', 'gear-consul-rosarius', default=1)
          add_rule(chap, 'rev28-rule-honour-legion', 'Honour of the Legion', 'The Chaplain and any unit he has joined have the Fearless special rule.')
          add_rule(chap, 'rev28-rule-liturgies', 'Liturgies of Battle', 'In a player turn in which the Chaplain and a unit he has joined successfully charge, the Chaplain and all models in that unit may re-roll failed To Hit rolls in close combat for that Assault phase.')

          # ---------- psychic power data ----------
          standard_powers = [
            ('Biomancy','Smite','Witchfire — 18", S4 AP2, Assault 4.'),
            ('Biomancy','Iron Arm','Blessing — Psyker gains +2 Strength and +1 Toughness.'),
            ('Biomancy','Enfeeble','Malediction — Enemy within 24": -1 Strength and Toughness; all movement counts as Difficult Terrain.'),
            ('Biomancy','Life Leech','Witchfire — 18", S6 AP2, Assault 2. If it causes an unsaved wound, one model within 6" of the Psyker regains a Wound.'),
            ('Biomancy','Warp Speed','Blessing — Psyker gains +3 Initiative and Attacks and Fleet.'),
            ('Biomancy','Endurance','Blessing — Friendly unit within 24" gains Eternal Warrior, Feel No Pain (5+) and Relentless.'),
            ('Biomancy','Haemorrhage','Focused Witchfire — 18". Target takes two Toughness tests or suffers a Wound with no armour/cover save; if slain, the effect may chain to another model within 2" until a Toughness test is passed.'),
            ('Divination','Prescience','Blessing — Friendly unit within 12" re-rolls all failed To Hit rolls.'),
            ('Divination','Foreboding','Blessing — Psyker and joined unit gain Counter-Attack and may fire reaction fire using the full number of allowed shots.'),
            ('Divination','Forewarning','Blessing — Friendly unit within 12" gains a 4+ Invulnerable Save.'),
            ('Divination','Perfect Timing','Blessing — Psyker and joined unit ignore cover when shooting.'),
            ('Divination','Precognition','Blessing — Psyker re-rolls failed To Hit and To Wound rolls and failed saving throws.'),
            ('Divination','Misfortune','Malediction — Enemy unit within 24": all attacks against it count as Rending.'),
            ('Divination','Scrier’s Gaze','Blessing — one reserve each turn may automatically pass; other Reserve and Outflank rolls may be re-rolled; mysterious objective rolls may be re-rolled.'),
            ('Pyromancy','Flame Breath','Witchfire — Template, S5 AP4, Assault 1, Soul Blaze.'),
            ('Pyromancy','Fiery Form','Blessing — Psyker gains 4+ Invulnerable Save; melee attacks cause Soul Blaze; re-roll failed wounds from other Pyromancy powers.'),
            ('Pyromancy','Molton Beam','Beam — 12", S8 AP1, Assault 1, Melta.'),
            ('Pyromancy','Fire Shield','Blessing — Friendly unit within 24" gains a 4+ Cover Save; enemies within 6" treat all terrain as Dangerous Terrain.'),
            ('Pyromancy','Sunburst','Nova — 9", S4 AP5, Assault 2D6, Ignores Cover, Soul Blaze.'),
            ('Pyromancy','Inferno','Witchfire — 24", S4 AP5, Assault 1, Large Blast, Ignores Cover, Soul Blaze.'),
            ('Pyromancy','Spontaneous Combustion','Focused Witchfire — 18". Target suffers S6 AP3 hit with Soul Blaze; if slain, place a Blast marker and models hit suffer S5 AP4, Ignores Cover, Soul Blaze.'),
            ('Telekinesis','Assail','Beam — 18", S6 AP-, Assault 1, Strikedown.'),
            ('Telekinesis','Crush','Focused Witchfire — 18". Roll 2D6 for Strength and a D6 for AP.'),
            ('Telekinesis','Objuration Mechanicum','Malediction — Enemy within 24": its ranged attacks gain Gets Hot; Vehicles suffer an immediate Haywire hit.'),
            ('Telekinesis','Shockwave','Nova — 9", S4 AP-, Assault 2D6, Pinning.'),
            ('Telekinesis','Levitation','Blessing — Psyker and joined unit immediately move up to 12"; cannot charge this turn and count as having moved.'),
            ('Telekinesis','Telekine Dome','Blessing — Psyker and friendly models within 12" gain a 5+ Invulnerable Save against shooting.'),
            ('Telekinesis','Psychic Maelstrom','Witchfire — 12", S10 AP1, Assault 1, Barrage, Large Blast.'),
            ('Telepathy','Psychic Shriek','Witchfire — 18". Roll 3D6 minus target Leadership; target suffers that many Wounds with no armour or cover saves.'),
            ('Telepathy','Dominate','Malediction — Enemy within 24" must pass a Leadership test each time it attempts to move, advance, shoot, charge or use a psychic power.'),
            ('Telepathy','Mental Fortitude','Blessing — Friendly unit within 24" immediately regroups if falling back and gains Fearless.'),
            ('Telepathy','Terrify','Malediction — Enemy within 24" suffers -1 Leadership, treats enemies as causing Fear, and must take a casualty test at end of turn.'),
            ('Telepathy','Hallucination','Malediction — Enemy within 24" rolls D6: 1-2 Pinning test; 3-4 -1 WS/BS/I/A; 5-6 random model takes one hit per other model at majority Strength.'),
            ('Telepathy','Invisibility','Blessing — Friendly unit within 24": enemies suffer -1 To Hit with ranged and melee attacks against it.'),
            ('Telepathy','Shrouding','Blessing — Friendly models within 6" of Psyker gain Shrouded.'),
          ]
          sanctic = [
            ('Banishment','Malediction — Enemy Daemon unit within 24" suffers -1 to Invulnerable Saves.'),
            ('Gate of Infinity','Blessing — Psyker and joined unit are removed and immediately redeployed using Deep Strike.'),
            ('Hammerhand','Blessing — Psyker and joined unit gain +2 Strength.'),
            ('Sanctuary','Blessing — Psyker and joined unit gain +1 Invulnerable Save (or 6+); Daemons treat all terrain within 12" as Dangerous Terrain.'),
            ('Purge Soul','Focused Witchfire — 24". Psyker and target roll D6 + Leadership; if Psyker total is at least target total, target suffers an automatic Wound with no armour/cover save.'),
            ('Cleansing Flame','Nova — 9", S5 AP4, Assault 2D6, Ignores Cover, Soul Blaze.'),
            ('Vortex of Doom','Witchfire — 12", S10 AP1, Assault 1, Blast, Vortex.'),
          ]
          malefic = [
            ('Summoning','Conjuration — 12". Summons a permitted Daemon unit using the normal ProHammer Daemonology rules.'),
            ('Cursed Earth','Blessing — Daemons within 12" gain +1 Invulnerable Save; Deep Striking Daemons do not scatter if the centre model is placed within 12".'),
            ('Dark Flame','Witchfire — Template, S4 AP5, Assault 1, Soul Blaze, Torrent.'),
            ('Possession','Conjuration — 6". Summons one Greater Daemon; invoking Psyker is removed as a casualty. Mastery Level 2+ only.'),
            ('Sacrifice','Conjuration — 6". Summons a Herald with permitted wargear; one friendly model within 6" suffers a Wound with no saves.'),
            ('Incursion','Conjuration — 12". Summons the permitted Daemon cavalry/beast unit listed in ProHammer.'),
            ('Infernal Gaze','Beam — 18", S3 AP4, Assault 1, Armourbane, Fleshbane.'),
          ]

          def psychic_group(parent, gid, powers, second_if=None):
              g1 = add_group(parent, gid+'-1', 'Psychic Power 1', 1, 1)
              for i,(disc,name,text) in enumerate(powers):
                  add_group_choice(g1, f'{gid}-p1-{i:02d}', f'{disc} — {name}', text)
              if second_if:
                  g2 = add_group(parent, gid+'-2', 'Psychic Power 2 (Epistolary)', 0, 1)
                  hide_unless(g2, gid+'-2-hide', second_if, 'parent')
                  for i,(disc,name,text) in enumerate(powers):
                      add_group_choice(g2, f'{gid}-p2-{i:02d}', f'{disc} — {name}', text)

          # ---------- Librarian ----------
          lib = by_id('hq-consul-librarian'); assert lib is not None
          add_link(lib, 'rev28-lib-force', 'Force Weapon', 'gear-hq-force', default=1)
          psychic_group(lib, 'rev28-lib-psychic', standard_powers, 'hq-librarian-epistolary')
          add_rule(lib, 'rev28-lib-psychic-rules', 'Psyker', 'Mastery Level 1. Select one psychic power from Biomancy, Divination, Pyromancy, Telekinesis or Telepathy. An Epistolary is Mastery Level 2 and selects two powers. Follow the normal ProHammer psychic rules. Daemonology is not available to a Legion Librarian.')

          # ---------- Moritat ----------
          mor = by_id('hq-consul-moritat'); assert mor is not None
          pg = add_group(mor, 'rev28-mor-pairs', 'Moritat Pistol Pair', 0, 1)
          add_group_choice(pg, 'rev28-mor-hand', 'Two Hand Flamers', 'Replaces both Bolt Pistols with two Hand Flamers. Each Hand Flamer: Template, S3 AP6, Pistol.', 10)
          add_group_choice(pg, 'rev28-mor-plasma', 'Two Plasma Pistols', 'Replaces both Bolt Pistols with two Plasma Pistols. Each Plasma Pistol: 12", S7 AP2, Pistol, Gets Hot.', 30)
          add_group_choice(pg, 'rev28-mor-volkite', 'Two Volkite Serpentas', 'Replaces both Bolt Pistols with two Volkite Serpentas.', 10)
          da = add_group_choice(pg, 'rev28-mor-da-plasma', 'Two Calibanite Plasma Pistols', 'Dark Angels only. Replaces both Bolt Pistols with two Calibanite Plasma Pistols.', 30)
          mods = ensure_container(da, 'modifiers')
          m = ET.SubElement(mods, T('modifier'), {'type':'set','value':'true','field':'hidden'})
          cs = ET.SubElement(m, T('conditions'))
          ET.SubElement(cs, T('condition'), {'type':'lessThan','value':'1','field':'selections','scope':'roster','childId':'legion-i','shared':'true','includeChildSelections':'true','includeChildForces':'false'})

          # ---------- Esoterist ----------
          eso = by_id('hq-consul-esoterist'); assert eso is not None
          add_link(eso, 'rev28-eso-force', 'Force Weapon', 'gear-hq-force', default=1)
          eg = add_group(eso, 'rev28-eso-psychic', 'Psychic Power', 1, 1)
          for i,(name,text) in enumerate(sanctic): add_group_choice(eg, f'rev28-eso-san-{i}', f'Sanctic — {name}', text)
          for i,(name,text) in enumerate(malefic): add_group_choice(eg, f'rev28-eso-mal-{i}', f'Malefic — {name}', text)
          add_rule(eso, 'rev28-eso-forbidden', 'Forbidden Lore', 'The Esoterist is a Mastery Level 1 Psyker and selects one power from Sanctic or Malefic Daemonology. Malefic powers may be selected regardless of Legion or Allegiance.')

          # ---------- Forge Lord ----------
          forge = by_id('hq-consul-forge'); assert forge is not None
          add_link(forge, 'rev28-forge-artificer', 'Artificer Armour', 'gear-hq-artificer', default=1)
          add_link(forge, 'rev28-forge-servo', 'Servo-Arm', 'gear-consul-servo-arm', default=1)
          add_rule(forge, 'rev28-forge-battlesmith', 'Battlesmith', 'Instead of shooting, the Forge Lord may attempt to repair an eligible friendly Vehicle or Battle-Automata in base contact. Follow the Battlesmith rules in this army list. The Servo-Arm provides its normal repair bonus.')

          # ---------- Master of Signals ----------
          sig = by_id('hq-consul-signals'); assert sig is not None
          add_link(sig, 'rev28-signals-nuncio', 'Nuncio Vox', 'gear-nuncio', default=1)
          add_link(sig, 'rev28-signals-cognis', 'Cognis Signum', 'gear-consul-cognis-signum', default=1)
          add_rule(sig, 'rev28-signals-orbital-ref', 'Orbital Bombardment', 'The Master of Signals may purchase one Orbital Bombardment from the existing Orbital Bombardment options in this entry. Plotting, Reserves, placement, inaccuracy, Ordnance Barrage and Pinning are resolved using the rules shown with those options.')

          # ---------- Primus Nullificator ----------
          nul = by_id('hq-consul-null'); assert nul is not None
          add_link(nul, 'rev28-null-maul', 'Aether-shock Maul', 'gear-consul-aether-maul', default=1)
          ng = add_group(nul, 'rev28-null-psychic', 'Sanctic Psychic Power', 1, 1)
          for i,(name,text) in enumerate(sanctic): add_group_choice(ng, f'rev28-null-san-{i}', f'Sanctic — {name}', text)
          add_rule(nul, 'rev28-null-wards', 'Hexagrammic Wards', 'An enemy Psyker attempting to use a psychic power which directly targets the Primus Nullificator or a unit he has joined suffers -1 Leadership for that Psychic Test.')
          add_rule(nul, 'rev28-null-credo', 'Credo Annihilato', 'The Primus Nullificator and any unit he has joined have Preferred Enemy (Daemons).')

          # ---------- Vigilator ----------
          vig = by_id('hq-consul-vigilator'); assert vig is not None
          add_link(vig, 'rev28-vig-bolter', 'Bolter', 'gear-bolter', default=1)
          add_link(vig, 'rev28-vig-camo', 'Cameleoline', 'gear-cameleoline', default=1)
          ammo = add_group(vig, 'rev28-vig-ammo', 'Special Issue Ammunition', 0, 1)
          add_group_choice(ammo, 'rev28-vig-dragon', 'Dragonfire Bolts', 'Bolter profile: 24", S4 AP5, Rapid Fire, Ignores Cover.')
          add_group_choice(ammo, 'rev28-vig-hellfire', 'Hellfire Bolts', 'Bolter profile: 24", SX AP5, Rapid Fire, Poisoned (2+).')
          add_group_choice(ammo, 'rev28-vig-kraken', 'Kraken Bolts', 'Bolter profile: 30", S4 AP4, Rapid Fire.')
          add_group_choice(ammo, 'rev28-vig-vengeance', 'Vengeance Rounds', 'Bolter profile: 18", S4 AP3, Rapid Fire, Gets Hot.')
          add_rule(vig, 'rev28-vig-ammo-rule', 'Special Issue Ammunition', 'Each time the Vigilator fires his Bolter, he may use Dragonfire, Hellfire, Kraken or Vengeance ammunition. This overrides the normal restriction limiting Special Issue Ammunition to Legion Seeker Squads.')

          # ---------- Praevian visible wargear + rules ----------
          praev = by_id('hq-consul-praevian'); assert praev is not None
          add_link(praev, 'rev28-praev-cortex', 'Cortex Controller', 'gear-consul-cortex-controller', default=1)
          add_link(praev, 'rev28-praev-designator', 'Cortex Designator', 'gear-consul-cortex-designator', default=1)
          induct = add_group(praev, 'rev28-praev-inductees', 'Legion Inductees', 1, 1)
          add_group_choice(induct, 'rev28-praev-induct-la', 'Praevian’s Legion Special Rule', 'The accompanying Battle-Automata gain the Legiones Astartes special rule of the Praevian’s Legion for the battle. Any part which cannot legally apply to their Unit Type has no effect.')
          add_group_choice(induct, 'rev28-praev-induct-fc', 'Furious Charge', 'The accompanying Battle-Automata gain Furious Charge.')
          add_group_choice(induct, 'rev28-praev-induct-th', 'Tank Hunters', 'The accompanying Battle-Automata gain Tank Hunters.')
          add_group_choice(induct, 'rev28-praev-induct-scout', 'Scout', 'The accompanying Battle-Automata gain Scout. The Praevian also gains Scout while attached to the Maniple.')
          add_rule(praev, 'rev28-praev-master-cybernetica', 'Master of Cybernetica', 'A Legion Praevian must be accompanied by a Castellax Battle-Automata Maniple or Vorax Battle-Automata Maniple purchased from the Mechanicum Army List. The Maniple does not occupy another Force Organisation choice; the Praevian and Maniple count as one HQ choice. The Praevian must begin attached and may not voluntarily leave while any Battle-Automata remain alive. The accompanying Maniple may not take Paragon of Metal.')

          # ---------- generic weapon reference profiles that were missing ----------
          weapons = root.find(T('sharedSelectionEntries'))
          demo = shared_upgrade('gear-rev28-demolisher', 'Demolisher Cannon', 'Weapon profile: 24", Strength 10, AP2, Ordnance 1, Large Blast.')
          flame = shared_upgrade('gear-rev28-flamestorm', 'Flamestorm Cannon', 'Weapon profile: Template, Strength 6, AP3, Heavy 1.')

          # ---------- revision / canonical output ----------
          root.set('revision','28')
          root.set('gameSystemRevision','12')
          ET.indent(tree, space='  ')
          xml_body = ET.tostring(root, encoding='unicode', short_empty_elements=True)
          output = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + xml_body + '\n'
          assert '<ns0:' not in output and 'xmlns:ns0=' not in output
          CAT.write_text(output, encoding='utf-8', newline='\n')

          # ---------- validation ----------
          check = ET.parse(CAT).getroot()
          assert check.get('revision') == '28'
          assert check.get('gameSystemRevision') == '12'
          ids = []
          for e in check.iter():
              if e.get('id'): ids.append(e.get('id'))
          dup = sorted({x for x in ids if ids.count(x) > 1})
          assert not dup, f'Duplicate IDs: {dup[:20]}'
          required = ['hq-consul-chaplain','hq-consul-librarian','hq-consul-moritat','hq-consul-esoterist','hq-consul-forge','hq-consul-signals','hq-consul-null','hq-consul-vigilator','hq-consul-praevian','gear-consul-crozius','gear-consul-rosarius']
          missing = [x for x in required if by_id(x) is None]
          assert not missing, missing
          print('REV28 OK: consul wargear visible, psychic selections added, global Force Weapon removed, Moritat pairs added, Vigilator ammo added, Praevian gear/rules added.')
      - name: Validate diff
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('Legiones Astartes.cat').read_text(encoding='utf-8')
