name: Apply corrected Legiones Astartes Elites batch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run corrected Elites builder and clean temporary files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-elites-batch.yml').read_text(encoding='utf-8')
          body = source.split("          python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())

          # Fix Python reserved-keyword use in helper attribute dictionaries.
          script = script.replace(
              "attrs=dict(type=typ,import='true',name=name,hidden=hidden,id=sid)",
              "attrs={'type':typ,'import':'true','name':name,'hidden':hidden,'id':sid}"
          )
          script = script.replace(
              "attrs=dict(import='true',name=name,hidden='false',id=lid,type='selectionEntry',targetId=target)",
              "attrs={'import':'true','name':name,'hidden':'false','id':lid,'type':'selectionEntry','targetId':target}"
          )

          # group(..., maxv=1) already creates these constraints; remove duplicate additions.
          skip = (
              "constraint(tr,'veteran-transport-max'",
              "constraint(tr,'terminator-transport-max'",
              "constraint(tr,'destroyer-transport-max'",
          )
          script = '\n'.join(line for line in script.splitlines() if not any(token in line for token in skip))

          # Use a robust lookup for the Dreadnought vehicle-upgrade group.
          script = script.replace(
              "vg=u.find(Q('selectionEntryGroups')).find(f\"{Q('selectionEntryGroup')}[@id='dreadnought-vehicle']\")",
              "vg=next(x for x in u.find(Q('selectionEntryGroups')) if x.get('id')=='dreadnought-vehicle')"
          )

          compile(script, 'elites_builder.py', 'exec')
          exec(compile(script, 'elites_builder.py', 'exec'), {})
          PY

          rm -f \
            .github/workflows/apply-elites-batch.yml \
            .github/workflows/apply-elites-batch-rerun.yml \
            .github/workflows/diagnose-elites.yml \
            .github/workflows/apply-elites-fixed.yml \
            .elites-error.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add core Legiones Astartes Elites [skip ci]"
          git push
