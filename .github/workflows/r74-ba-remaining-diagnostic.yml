name: Blood Angels remaining restriction diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/r74_diag_ba_remaining.py'
      - '.github/workflows/r74-ba-remaining-diagnostic.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Inspect remaining Blood Angels restrictions
        run: python .github/build/r74_diag_ba_remaining.py
      - name: Commit diagnostic
        run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add inspection-r74-ba-remaining.txt
          git diff --cached --quiet || git commit -m 'Add Blood Angels remaining restriction diagnostic'
          git pull --rebase origin main
          for i in 1 2 3 4; do git push && break || { sleep 2; git pull --rebase origin main; }; done
