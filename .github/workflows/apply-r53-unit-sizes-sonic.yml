name: Apply Revision 53 unit sizes and sonic HSS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/rev53_unit_sizes_and_sonic_hss.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Revision 53
        run: python .github/build/rev53_unit_sizes_and_sonic_hss.py
      - name: Validate canonical BattleScribe namespaces
        run: |
          grep -q '<catalogue xmlns="http://www.battlescribe.net/schema/catalogueSchema"' 'Legiones Astartes.cat'
          grep -q '<gameSystem xmlns="http://www.battlescribe.net/schema/gameSystemSchema"' 'Prohammer 30k.gst'
          ! grep -q '<ns0:' 'Legiones Astartes.cat'
          ! grep -q '<ns0:' 'Prohammer 30k.gst'
      - name: Publish Revision 53
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-r53-unit-sizes-sonic.txt
          git diff --cached --quiet || git commit -m "Revision 53: use total squad sizes and restore EC sonic weapons"
          git push
