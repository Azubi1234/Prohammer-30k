name: Diagnose BattleScribe schema
on:
  push:
    paths:
      - '.github/workflows/diag-schema.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XML tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Fetch BattleScribe 2.03 schema and validate
        shell: bash
        run: |
          set -o pipefail
          curl -fsSL 'https://raw.githubusercontent.com/alexdawn/battle-cogitator/ec1cc7283c5c5c656f8892d0351dfe4879fdcb2d/notebooks/battlescribe/catelogue_schema.xsd' -o /tmp/catalogue.xsd
          cp /tmp/catalogue.xsd /tmp/gamesystem.xsd
          sed -i 's#http://www.battlescribe.net/schema/catalogueSchema#http://www.battlescribe.net/schema/gameSystemSchema#g' /tmp/gamesystem.xsd
          echo '=== CATALOGUE ==='
          xmllint --noout --schema /tmp/catalogue.xsd 'Legiones Astartes.cat' 2>&1 | tee /tmp/cat.log || true
          echo '=== GAME SYSTEM ==='
          xmllint --noout --schema /tmp/gamesystem.xsd 'Prohammer 30k.gst' 2>&1 | tee /tmp/gst.log || true
          echo '=== ERROR COUNTS ==='
          echo "CAT errors: $(grep -c ': element ' /tmp/cat.log || true)"
          echo "GST errors: $(grep -c ': element ' /tmp/gst.log || true)"
