name: Apply Revision 25 expansion
on:
  push:
    paths:
      - '.github/workflows/apply-rev25.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch final authoritative project sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          curl --retry 3 --retry-delay 2 -L -sS 'https://docs.google.com/document/d/1Rem0x-V74HRqpCBlqDGD5x4sTUQ0lEw-WB9xvqOUkIA/export?format=md' -o 'sources/Legiones Astartes Army List.md'
          curl --retry 3 --retry-delay 2 -L -sS 'https://docs.google.com/document/d/15yOQ5xqfa7QAJ15GlHqN7F4HvO_jk6K1w5fQ2xkGngk/export?format=md' -o 'sources/Forces of the Legions.md'
          curl --retry 3 --retry-delay 2 -L -sS 'https://docs.google.com/document/d/1ZDtRchn_AtKUGT922-EyoyXfZDajVwAdl-QeyhZG-S4/export?format=md' -o 'sources/Lords of War.md'
          curl --retry 3 --retry-delay 2 -L -sS 'https://docs.google.com/document/d/1wkGCuVmsIeBmhRyZR0X9ftQUSqG3RDwlSY774Zt749Y/export?format=md' -o 'sources/Areonautica Imperialis.md'
          test -s 'sources/Forces of the Legions.md'
          test -s 'sources/Lords of War.md'
          test -s 'sources/Areonautica Imperialis.md'
      - name: Materialise Revision 25
        shell: bash
        run: |
          set -euo pipefail
          python .github/build/rev25_apply.py
          git diff --check
      - name: Validate BattleScribe XML and Revision 25 content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter

          CAT='Legiones Astartes.cat'; GST='Prohammer 30k.gst'
          ct=ET.parse(CAT); cr=ct.getroot(); gt=ET.parse(GST); gr=gt.getroot()
          cns=cr.tag.split('}')[0]+'}'; gns=gr.tag.split('}')[0]+'}'
          cq=lambda t:cns+t; gq=lambda t:gns+t

          assert cr.get('revision') == '25', cr.get('revision')
          assert int(gr.get('revision','0')) >= 10
          assert cr.get('gameSystemRevision') == gr.get('revision')

          for root,label in [(cr,'catalogue'),(gr,'game system')]:
              ids=[e.get('id') for e in root.iter() if e.get('id')]
              dup=[i for i,n in Counter(ids).items() if n>1]
              if dup:
                  raise AssertionError(f'Duplicate IDs in {label}: {dup[:30]}')

          all_ids={e.get('id') for e in cr.iter() if e.get('id')} | {e.get('id') for e in gr.iter() if e.get('id')}
          broken=[]
          for e in cr.iter():
              eid=e.get('id','')
              target=e.get('targetId')
              if eid.startswith('r25-') and target and target not in all_ids:
                  broken.append((eid,target))
          if broken:
              raise AssertionError(f'Broken generated target IDs: {broken[:30]}')

          def byid(root, ident):
              return next((e for e in root.iter() if e.get('id')==ident),None)
          assert byid(gr,'cat-retinue') is not None
          assert byid(gr,'fl-retinue') is not None
          assert byid(gr,'vehicle-sp') is not None
          low=byid(gr,'fl-low'); assert low is not None
          assert byid(gr,'r25-fl-low-max') is not None

          top=cr.find(cq('selectionEntries'))
          top_entries=list(top) if top is not None else []
          legion_units=[e for e in top_entries if e.get('id','').startswith('r25-unit-')]
          low_units=[e for e in top_entries if e.get('id','').startswith('r25-low-')]
          aero_units=[e for e in top_entries if e.get('id','').startswith('r25-aero-')]
          assert len(legion_units) == 189, len(legion_units)
          assert len(low_units) == 10, len(low_units)
          assert len(aero_units) == 5, len(aero_units)

          rites=[e for e in cr.iter() if e.get('id','').startswith('r25-rite-') and e.tag.endswith('selectionEntry')]
          assert len(rites) == 36, len(rites)
          consul_entries=[e for e in cr.iter() if e.get('id','').startswith('r25-consul-') and e.tag.endswith('selectionEntry')]
          assert len(consul_entries) == 5, len(consul_entries)

          names={e.get('name','').upper() for e in top_entries}
          expected=[
              'FULGRIM, THE PHOENICIAN','V — JAGHATAI KHAN, THE WARHAWK','VI — LEMAN RUSS, THE WOLF KING',
              'VII — ROGAL DORN, THE PRAETORIAN OF TERRA','IX — SANGUINIUS, THE GREAT ANGEL',
              'X — FERRUS MANUS, THE GORGON','XII — ANGRON, THE RED ANGEL','XIII — ROBOUTE GUILLIMAN, THE AVENGING SON',
              'XIV — MORTARION, THE REAPER','XV — MAGNUS THE RED, THE CRIMSON KING','XVI — HORUS LUPERCAL, THE WARMASTER',
              'XVII — LORGAR AURELIAN, THE URIZEN','XVIII — VULKAN, THE FORGEFATHER',
              'XIX — CORVUS CORAX, THE RAVEN-LORD','XX — ALPHARIUS, THE HYDRA',
              'LEGION FELLBLADE SUPER-HEAVY TANK','LEGION THUNDERHAWK GUNSHIP','XIPHON PATTERN INTERCEPTOR'
          ]
          missing=[n for n in expected if n not in names]
          if missing:
              raise AssertionError(f'Missing representative Rev25 entries: {missing}')

          # Confirm specialist replacement gates exist on generic Consuls.
          for ident in ['hq-consul-librarian','hq-consul-chaplain','hq-consul-medicae']:
              assert byid(cr,ident) is not None
          assert byid(cr,'r25-consul-x-iron-father') is not None

          # Ensure no Revision 25 top-level unit was generated from the explicitly excluded experimental source.
          for e in top_entries:
              if e.get('id','').startswith('r25-'):
                  n=e.get('name','').lower()
                  assert 'experimental wargear' not in n and 'experimental units' not in n

          print('VALIDATION OK')
          print('Catalogue revision:',cr.get('revision'),'GST revision:',gr.get('revision'))
          print('Generated legion units:',len(legion_units),'Rites:',len(rites),'specialist Consuls:',len(consul_entries),'LoW:',len(low_units),'Aeronautica:',len(aero_units))
          PY
      - name: Publish Revision 25
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst'
          if git diff --cached --quiet; then
            echo 'No catalogue changes to publish.'
          else
            git commit -m 'Revision 25: expand all Legions, Lords of War and Aeronautica'
            git push
          fi
