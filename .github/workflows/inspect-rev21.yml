name: Inspect current catalogue
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-rev21.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect catalogue structure
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          p='Legiones Astartes.cat'
          ns='http://www.battlescribe.net/schema/catalogueSchema'
          q=lambda t:'{%s}%s'%(ns,t)
          r=ET.parse(p).getroot()
          print('REVISION',r.get('revision'))
          roots=r.find(q('selectionEntries'))
          print('ROOT ENTRIES')
          for e in roots.findall(q('selectionEntry')):
              cats=[c.get('targetId') for c in (e.find(q('categoryLinks')) or [])]
              print(e.get('id'),'|',e.get('name'),'|',e.get('type'),'|',cats)
          print('SHARED TARGETS')
          shared=r.find(q('sharedSelectionEntries'))
          for e in shared.findall(q('selectionEntry')):
              if any(k in (e.get('name') or '').lower() for k in ['land raider','spartan','plasma','missile launcher','heavy bolter','grenade harness','rad grenade','phosphex','digital weapon','terminator armour']):
                  print(e.get('id'),'|',e.get('name'))
