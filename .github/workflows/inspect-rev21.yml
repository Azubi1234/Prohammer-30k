name: Inspect current catalogue
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-rev21.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect HQ groups and useful IDs
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          p='Legiones Astartes.cat'
          ns='http://www.battlescribe.net/schema/catalogueSchema'
          q=lambda t:'{%s}%s'%(ns,t)
          r=ET.parse(p).getroot(); roots=r.find(q('selectionEntries'))
          for rid in ['hq-praetor','hq-centurion','tactical-unit','assault-unit','terminator-unit','fa-bike','fa-sky-hunter','hs-heavy-support-squad']:
              e=next((x for x in roots.findall(q('selectionEntry')) if x.get('id')==rid),None)
              if e is None: continue
              print('\nENTRY',rid,e.get('name'))
              for g in e.iter(q('selectionEntryGroup')):
                  print(' GROUP',g.get('id'),'|',g.get('name'))
                  for x in list(g):
                      if x.tag in [q('selectionEntry'),q('entryLink')]:
                          print('   ',x.tag.split('}')[-1],x.get('id'),'|',x.get('name'),'target',x.get('targetId'))
          shared=r.find(q('sharedSelectionEntries'))
          print('\nSHARED USEFUL')
          for e in shared.findall(q('selectionEntry')):
              if any(k in (e.get('name') or '').lower() for k in ['land raider','spartan','plasma','missile launcher','heavy bolter','grenade harness','rad grenade','phosphex','digital weapon','refractor','iron halo','combi-bolter','power fist','thunder hammer','lightning claws']):
                  print(e.get('id'),'|',e.get('name'))
