name: Apply Revision 29 Consul Cleanup
on:
  push:
    paths:
      - '.github/workflows/apply-consul-cleanup-r28.yml'
      - '.github/build/apply_r29_consul_cleanup.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Revision 29 cleanup
        shell: bash
        run: |
          set -euo pipefail
          python .github/build/apply_r29_consul_cleanup.py
          git diff --check
      - name: Commit Revision 29 catalogue
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat'
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Revision 29: clean up Consuls and psychic options'
            git push
          fi
