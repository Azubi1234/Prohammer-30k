name: Diagnose Sigismund vs Hvarl structure
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/diag_r67_sig_vs_hvarl.py'
      - '.github/workflows/diag-r67-sig-vs-hvarl.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r67_sig_vs_hvarl.py
