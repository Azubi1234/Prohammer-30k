name: Materialize revision 25 partial builder
on:
  push:
    paths:
      - '.github/workflows/materialize-rev25.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged builder chunks
        shell: bash
        run: |
          set -euo pipefail
          cat .github/rev25/part*.b64 | base64 -d > .github/build/rev25_partial.py
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/build/rev25_partial.py')
          print('decoded bytes', p.stat().st_size)
          print('tail:')
          print(p.read_text(encoding='utf-8', errors='replace')[-1200:])
          PY
      - name: Commit decoded partial builder
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/build/rev25_partial.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Materialize revision 25 partial builder [skip ci]'
            git push
          fi
