name: Apply Revision 83 Iron Hands Scions final
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/rev83_iron_hands_scions_final.py'
      - '.github/workflows/apply-r83-iron-hands-scions-final.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/rev83_iron_hands_scions_final.py
      - run: python .github/build/r56_audit_all_unit_sizes.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot();g=ET.parse('Prohammer 30k.gst').getroot()
          assert c.get('revision')=='83' and c.get('gameSystemRevision')=='50' and g.get('revision')=='50'
          print(open('inspection-r83-iron-hands-scions-final.txt',encoding='utf-8').read())
          PY
      - name: Commit
        run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-r83-iron-hands-scions-final.txt inspection-r56-all-unit-sizes.txt
          git diff --cached --quiet || git commit -m 'Revision 83: finalize Iron Hands Scions transport mechanics'
          git pull --rebase origin main
          for i in 1 2 3 4; do git push && break || { sleep 2; git pull --rebase origin main; }; done
