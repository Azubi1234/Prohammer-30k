name: Diagnose Revision 71 Night Lords
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/r71_diag_night_lords.py'
      - '.github/workflows/diag-r71-night-lords.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Night Lords diagnostic
        run: python .github/build/r71_diag_night_lords.py
      - name: Commit diagnostic
        run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add inspection-r71-night-lords-diagnostic.txt
          git diff --cached --quiet || git commit -m 'Revision 71 diagnostic: audit Night Lords'
          git push
