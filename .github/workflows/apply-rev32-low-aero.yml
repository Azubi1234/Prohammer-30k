name: Apply Revision 32 Lords of War and Aeronautica
on:
  push:
    paths:
      - '.github/workflows/apply-rev32-low-aero.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Revision 32 builder
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/rev32_low_aero.py
          for f in \
            .github/rev32/part00.b64 \
            .github/rev32/part01.b64 \
            .github/rev32/part02.b64 \
            .github/rev32/part03.b64
          do
            base64 -d "$f" >> /tmp/rev32_low_aero.py
          done
          python -m py_compile /tmp/rev32_low_aero.py
      - name: Apply Revision 32
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/rev32_low_aero.py
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          c = Path('Legiones Astartes.cat')
          r = ET.parse(c).getroot()
          assert r.get('revision') == '32', r.get('revision')
          assert r.get('gameSystemRevision') == '12', r.get('gameSystemRevision')
          t = c.read_text(encoding='utf-8')
          assert '<ns0:' not in t[:2000]
          assert '\n<catalogue ' in t[:300]
          print('Revision 32 validation OK')
          PY
          git diff --check
      - name: Commit Revision 32 data
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat'
          if git diff --cached --quiet; then
            echo 'No catalogue changes'
          else
            git commit -m 'Revision 32: add Lords of War and Aeronautica'
            git push
          fi
