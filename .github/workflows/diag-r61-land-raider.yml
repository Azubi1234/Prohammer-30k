name: Diagnose Revision 61 Land Raider transport structure
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/diag_r61_land_raider.py'
      - '.github/workflows/diag-r61-land-raider.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r61_land_raider.py
