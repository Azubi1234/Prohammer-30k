name: Diagnose Revision 62 Space Wolves base
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/diag_r62_space_wolves_base.py'
      - '.github/workflows/diag-r62-space-wolves-base.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r62_space_wolves_base.py
