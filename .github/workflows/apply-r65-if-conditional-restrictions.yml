name: Apply Revision 65 Imperial Fists conditional restrictions
on:
  push:
    paths:
      - '.github/build/rev65_if_conditional_restrictions.py'
      - '.github/workflows/apply-r65-if-conditional-restrictions.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Imperial Fists conditional restrictions
        run: python .github/build/rev65_if_conditional_restrictions.py
      - name: Run permanent unit-size audit
        run: python .github/build/r56_audit_all_unit_sizes.py
      - name: Verify Revision 65
        run: |
          grep -q 'dataRevision="65"' index.xml
          grep -q 'dataRevision="33"' index.xml
          grep -q 'Stone Gauntlet — Shield-bearing Independent Character' 'Legiones Astartes.cat'
          grep -q 'Hammerfall Warlord Requirement' 'Legiones Astartes.cat'
          grep -q 'Templar Assault Warlord Requirement' 'Legiones Astartes.cat'
          grep -q 'Revision 65 — Imperial Fists conditional restriction pass' inspection-r65-imperial-fists-conditional.txt
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-r65-imperial-fists-conditional.txt inspection-r56-all-unit-sizes.txt
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Revision 65: enforce Imperial Fists conditional restrictions'
            git push
          fi
