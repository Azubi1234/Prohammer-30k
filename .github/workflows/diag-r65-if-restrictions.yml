name: Diagnose Revision 65 Imperial Fists restrictions
on:
  push:
    paths:
      - '.github/build/diag_r65_if_restrictions.py'
      - '.github/workflows/diag-r65-if-restrictions.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r65_if_restrictions.py
