name: Diagnose Revision 80 Iron Hands repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/r80_diag_iron_hands_fix.py'
      - '.github/workflows/diag-r80-iron-hands-fix.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Diagnose live Iron Hands
        run: python .github/build/r80_diag_iron_hands_fix.py
      - name: Commit diagnostic
        run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add inspection-r80-iron-hands-fix-diag.txt
          git diff --cached --quiet || git commit -m 'Revision 80 diagnostic: inspect live Iron Hands repair targets'
          git pull --rebase origin main
          for i in 1 2 3; do git push && break || { sleep 2; git pull --rebase origin main; }; done
