name: Apply Revision 72 Night Lords final polish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/rev72_night_lords_polish.py'
      - '.github/workflows/apply-r72-night-lords-polish.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Revision 72 Night Lords polish
        run: python .github/build/rev72_night_lords_polish.py
      - name: Run permanent unit-size audit
        run: python .github/build/r56_audit_all_unit_sizes.py
      - name: Verify Revision 72
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot(); g=ET.parse('Prohammer 30k.gst').getroot()
          assert c.get('revision')=='72' and c.get('gameSystemRevision')=='40'
          assert g.get('revision')=='40'
          cat=open('Legiones Astartes.cat',encoding='utf-8').read(); gst=open('Prohammer 30k.gst',encoding='utf-8').read()
          assert '<ns0:' not in cat and '<ns0:' not in gst
          print(open('inspection-r72-night-lords-final.txt',encoding='utf-8').read())
          PY
      - name: Commit generated live data
        run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-r72-night-lords-final.txt inspection-r56-all-unit-sizes.txt
          git diff --cached --quiet || git commit -m 'Revision 72: finalize Night Lords implementation'
          git pull --rebase origin main
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
            git pull --rebase origin main
          done
          exit 1
