name: Apply Revision 84 New Recruit namespace fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/rev84_normalize_newrecruit_xml.py'
      - '.github/workflows/apply-r84-newrecruit-namespace-fix.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize live CAT and GST
        run: python .github/build/rev84_normalize_newrecruit_xml.py
      - name: Validate XML and canonical roots
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('Legiones Astartes.cat')
          ET.parse('Prohammer 30k.gst')
          ET.parse('index.xml')
          c=Path('Legiones Astartes.cat').read_text(encoding='utf-8')
          g=Path('Prohammer 30k.gst').read_text(encoding='utf-8')
          assert '<catalogue xmlns="http://www.battlescribe.net/schema/catalogueSchema"' in c
          assert '<gameSystem xmlns="http://www.battlescribe.net/schema/gameSystemSchema"' in g
          assert '<ns0:' not in c and '<ns0:' not in g
          print(open('inspection-r84-newrecruit-namespace-fix.txt',encoding='utf-8').read())
          PY
      - name: Run permanent unit-size audit
        run: python .github/build/r56_audit_all_unit_sizes.py
      - name: Commit canonical live data
        run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-r84-newrecruit-namespace-fix.txt inspection-r56-all-unit-sizes.txt
          git diff --cached --quiet || git commit -m 'Revision 84: restore New Recruit canonical XML namespaces'
          git pull --rebase origin main
          for i in 1 2 3 4; do git push && break || { sleep 2; git pull --rebase origin main; }; done
