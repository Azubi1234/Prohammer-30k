name: Apply Revision 59 New Recruit force refresh

on:
  push:
    paths:
      - '.github/build/rev59_force_iw_refresh.py'
      - '.github/workflows/apply-r59-force-iw-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Revision 59
        run: python .github/build/rev59_force_iw_refresh.py
      - name: Run permanent unit-size audit
        run: python .github/build/r56_audit_all_unit_sizes.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-r59-force-refresh.txt inspection-r56-all-unit-sizes.txt
          git diff --cached --quiet || git commit -m "Revision 59: force refresh corrected squad sizes"
          git push
