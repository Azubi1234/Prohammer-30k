name: Build core Fast Attack catalogue entries
on:
  push:
    paths:
      - '.github/workflows/add-fast-attack.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Fast Attack section
        shell: bash
        run: |
          python <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter

          PATH='Legiones Astartes.cat'
          NS='http://www.battlescribe.net/schema/catalogueSchema'
          ET.register_namespace('', NS)
          Q=lambda x:f'{{{NS}}}{x}'
          tree=ET.parse(PATH); root=tree.getroot()

          def sub(p,t,**a): return ET.SubElement(p,Q(t),{k:str(v) for k,v in a.items()})
          def container(p,t):
              e=p.find(Q(t))
              if e is None: e=sub(p,t)
              return e
          def cost(p,v):
              c=container(p,'costs'); sub(c,'cost',name='Points',typeId='pts',value=v)
          def con(p,i,typ,val,field='selections',scope='parent',children='false',automatic=None):
              c=container(p,'constraints'); a=dict(id=i,type=typ,value=val,field=field,scope=scope,shared='true',includeChildSelections=children)
              if automatic is not None:a['automatic']=automatic
              return sub(c,'constraint',**a)
          def rule(p,name,i,text):
              rs=container(p,'rules'); r=sub(rs,'rule',name=name,id=i,hidden='false'); d=sub(r,'description'); d.text=text; return r
          def profile(p,name,i,typ,vals):
              ps=container(p,'profiles'); pr=sub(ps,'profile',name=name,id=i,typeId=typ,typeName={'prof-model':'Model','prof-vehicle':'Vehicle','prof-ranged':'Ranged Weapon'}[typ],hidden='false'); cs=sub(pr,'characteristics')
              ids={'prof-model':['model-ws','model-bs','model-s','model-t','model-w','model-i','model-a','model-ld','model-sv'],'prof-vehicle':['vehicle-bs','vehicle-front','vehicle-side','vehicle-rear'],'prof-ranged':['ranged-range','ranged-s','ranged-ap','ranged-type']}[typ]
              names={'prof-model':['WS','BS','S','T','W','I','A','Ld','Sv'],'prof-vehicle':['BS','Front','Side','Rear'],'prof-ranged':['Range','S','AP','Type']}[typ]
              for n,cid,v in zip(names,ids,vals): x=sub(cs,'characteristic',name=n,typeId=cid); x.text=str(v)
              return pr
          def unit(name,i,pts=0):
              u=sub(sel,'selectionEntry',type='unit',import_='true',name=name,hidden='false',id=i)
              # ElementTree cannot emit import via keyword alias; repair below
              u.attrib.pop('import_',None);u.set('import','true')
              cls=sub(u,'categoryLinks'); sub(cls,'categoryLink',targetId='cat-fast',id=i+'-cat',primary='true',name='Fast Attack',hidden='false')
              if pts: cost(u,pts)
              return u
          def model(p,name,i,stats,default=None,minv=None,maxv=None,pts=0,vehicle=False):
              es=container(p,'selectionEntries'); a=dict(type='model',name=name,hidden='false',id=i); a['import']='true'
              if default is not None:a['defaultAmount']=default
              m=sub(es,'selectionEntry',**a)
              if minv is not None: con(m,i+'-min','min',minv,automatic='true')
              if maxv is not None: con(m,i+'-max','max',maxv,automatic='true' if minv is not None and minv==maxv else None)
              if pts:cost(m,pts)
              profile(m,name,i+'-prof','prof-vehicle' if vehicle else 'prof-model',stats)
              return m
          def group(p,name,i,maxv=None,minv=None,children='true'):
              gs=container(p,'selectionEntryGroups'); g=sub(gs,'selectionEntryGroup',name=name,id=i,hidden='false')
              if minv is not None:con(g,i+'-min','min',minv,children=children)
              if maxv is not None:con(g,i+'-max','max',maxv,children=children)
              return g
          def link(p,name,i,target,pts=0,maxv=1):
              ls=container(p,'entryLinks'); l=sub(ls,'entryLink',import_='true',name=name,hidden='false',id=i,type='selectionEntry',targetId=target);l.attrib.pop('import_',None);l.set('import','true')
              if maxv is not None:con(l,i+'-max','max',maxv,children='false')
              if pts:cost(l,pts)
              return l
          def upgrade(p,name,i,pts=0,maxv=1,default=None):
              es=container(p,'selectionEntries'); a=dict(type='upgrade',name=name,hidden='false',id=i,import_='true');
              if default is not None:a['defaultAmount']=default
              e=sub(es,'selectionEntry',**a);e.attrib.pop('import_',None);e.set('import','true')
              if maxv is not None:con(e,i+'-max','max',maxv,children='false')
              if pts:cost(e,pts)
              return e
          def mod_set(p,field,val,child,atleast=1,scope='root-entry'):
              ms=container(p,'modifiers');m=sub(ms,'modifier',type='set',value=val,field=field);cs=sub(m,'conditions');sub(cs,'condition',type='atLeast',value=atleast,field='selections',scope=scope,childId=child,shared='true',includeChildSelections='true');return m
          def repeat_cost(e,amount,child):
              ms=container(e,'modifiers');m=sub(ms,'modifier',type='increment',value=amount,field='pts');rs=sub(m,'repeats');sub(rs,'repeat',value='1',repeats='1',field='selections',scope='root-entry',childId=child,shared='true',roundUp='false',includeChildSelections='false')
          def squad_upgrade(g,name,i,target,per,base,additional):
              e=link(g,name,i,target,pts=per*base,maxv=1);repeat_cost(e,per,additional);return e
          def dynamic_max(g,constraint_id,child,levels):
              for threshold,val in levels: mod_set(g,constraint_id,val,child,threshold)
          def shared_by_id(i): return shared.find(f"{Q('selectionEntry')}[@id='{i}']")
          def shared_by_name(name):
              for e in shared.findall(Q('selectionEntry')):
                  if e.get('name')==name:return e
          def ensure_weapon(name,i,profiles,rules=None):
              e=shared_by_name(name) or shared_by_id(i)
              if e is not None:return e.get('id')
              e=sub(shared,'selectionEntry',type='upgrade',import_='true',name=name,hidden='false',id=i);e.attrib.pop('import_',None);e.set('import','true')
              for j,(pn,vals) in enumerate(profiles):profile(e,pn,f'{i}-prof-{j}','prof-ranged',vals)
              for j,(rn,txt) in enumerate(rules or []):rule(e,rn,f'{i}-rule-{j}',txt)
              return i

          shared=root.find(Q('sharedSelectionEntries')); sel=root.find(Q('selectionEntries'))
          if shared is None or sel is None: raise SystemExit('Catalogue containers missing')

          # Idempotent: replace the six core Fast Attack entries only.
          unit_ids={'fa-seeker','fa-bike','fa-sky-hunter','fa-attack-bike','fa-land-speeder','fa-javelin'}
          unit_names={'Legion Seeker Squad','Legion Bike Squadron','Legion Sky Hunter Jetbike Squadron','Legion Attack Bike Squadron','Legion Land Speeder Squadron','Legion Javelin Attack Speeder Squadron'}
          for e in list(sel):
              if e.tag==Q('selectionEntry') and (e.get('id') in unit_ids or e.get('name') in unit_names):sel.remove(e)

          # Reuse existing catalogue gear where available; add only Fast Attack-specific profiles absent from the shared library.
          stalker=ensure_weapon('M.40 Targeter and Stalker Bolter','fa-gear-stalker',[('M.40 Targeter and Stalker Bolter',['24"','4','5','Heavy 2, Pinning'])])
          seeker_hb=ensure_weapon('Heavy Bolter with Suspensor and Hellfire Rounds','fa-gear-seeker-hb',[
              ('Heavy Bolter - Suspensor Fire',['18"','5','4','Assault 3']),('Heavy Bolter - Hellfire Round',['36"','5','4','Heavy 1, Blast, Hellfire'])],
              [('Hellfire','Hellfire attacks wound non-vehicle targets on a 2+ unless a better roll would normally be required; resolve other effects normally.')])
          tl_flamer=ensure_weapon('Twin-linked Flamer','fa-gear-tl-flamer',[('Twin-linked Flamer',['Template','4','5','Assault 1, Twin-linked'])])
          tl_melta=ensure_weapon('Twin-linked Meltagun','fa-gear-tl-melta',[('Twin-linked Meltagun',['12"','8','1','Assault 1, Melta, Twin-linked'])])
          tl_plasma=ensure_weapon('Twin-linked Plasma Gun','fa-gear-tl-plasma',[('Twin-linked Plasma Gun',['24"','7','2','Rapid Fire, Gets Hot, Twin-linked'])])
          hk=ensure_weapon('Hunter-Killer Missile','fa-gear-hk',[('Hunter-Killer Missile',['Unlimited','8','3','Heavy 1, One Use'])])
          havoc=ensure_weapon('Havoc Launcher','fa-gear-havoc',[('Havoc Launcher',['48"','4','5','Heavy 2, Blast'])])
          typhoon=ensure_weapon('Typhoon Missile Launcher','fa-gear-typhoon',[('Typhoon Missile Launcher',['48"','5','5','Heavy 1, Blast'])])
          tl_cyclone=ensure_weapon('Twin-linked Cyclone Missile Launcher','fa-gear-tl-cyclone',[
              ('Twin-linked Cyclone Missile Launcher - Frag',['48"','4','6','Heavy 2, Blast, Twin-linked']),('Twin-linked Cyclone Missile Launcher - Krak',['48"','8','3','Heavy 2, Twin-linked'])])
          tl_las=ensure_weapon('Twin-linked Lascannon','fa-gear-tl-las',[('Twin-linked Lascannon',['48"','9','2','Heavy 1, Twin-linked'])])
          assault=ensure_weapon('Assault Cannon','fa-gear-assault',[('Assault Cannon',['24"','6','4','Heavy 3, Rending'])],[('Rending','On a natural To Wound roll of 6, the wound is automatically successful and treated as a Power Weapon attack. Against vehicles, an Armour Penetration roll of 6 adds an additional D3.')])

          # Special Issue Ammunition is standard Seeker wargear; profiles are shown directly on the unit.
          ammo_profiles=[
              ('Dragonfire Bolts',['24"','4','5','Rapid Fire, Ignores Cover']),('Hellfire Bolts',['24"','X','5','Rapid Fire, Poisoned (2+)']),
              ('Kraken Bolts',['30"','4','4','Rapid Fire']),('Vengeance Rounds',['18"','4','3','Rapid Fire, Gets Hot'])]

          # Generic Sergeant Armoury. Explicit unit options are deliberately omitted here to prevent duplicates.
          armoury_common=[
              ('Combi-Bolter','gear-combi-bolter',5),('Combi-Flamer','gear-combi-flamer',10),('Combi-Grenade Launcher','gear-combi-grenade',10),('Combi-Meltagun','gear-combi-melta',15),('Combi-Plasma Gun','gear-combi-plasma',15),('Combi-Volkite Charger','gear-combi-volkite',10),('Storm Bolter','gear-storm-bolter',5),
              ('Combat Shield','gear-combat-shield',5),('Auspex','gear-auspex',2),('Bionics','gear-bionics',10),('Purity Seals','gear-purity',5),('Teleport Homer','gear-homer',5)]
          def add_armoury(p,prefix,extras=()):
              g=group(p,'Additional Sergeant Armoury (max 50 pts)',prefix+'-armoury')
              con(g,prefix+'-armoury-pts-max','max',50,field='pts',children='true')
              for n,t,c in list(extras)+armoury_common: link(g,n,prefix+'-arm-'+t.replace('gear-',''),t,c,1)
              rule(g,'Sergeant Armoury Restrictions',prefix+'-arm-rule','Up to 50 points of permitted additional Space Marine Armoury equipment. Standard wargear and unit-specific options are not repeated here. No item may be selected more than once unless specifically permitted; normal Armoury weapon limits still apply.')
              return g

          def add_sergeant_weapons(p,prefix,pair_cost=20,seeker=False):
              pg=group(p,'Sergeant Bolt Pistol Replacement',prefix+'-pistol',maxv=1)
              for n,t,c,s in [('Volkite Serpenta','gear-volkite-serpenta',5,'vs'),('Hand Flamer','gear-hand-flamer',5,'hf'),('Plasma Pistol','gear-plasma-pistol',15,'pp')]:link(pg,n,prefix+'-'+s,t,c,1)
              mg=group(p,'Sergeant Melee Weapon',prefix+'-melee',maxv=1)
              opts=[('Power Weapon','gear-power-weapon',10,'pw'),('Lightning Claw','gear-lightning-claw',15,'lc'),('Power Fist','gear-power-fist',15,'pf')]
              if not seeker:opts=[('Rending Weapon','gear-rending',5,'rw')]+opts+[('Thunder Hammer','gear-thunder',20,'th')]
              for n,t,c,s in opts:link(mg,n,prefix+'-'+s,t,c,1)
              if not seeker:
                  pairg=group(p,'Alternative: replace Bolt Pistol and Chainsword',prefix+'-pairg',maxv=1)
                  pair=link(pairg,'Pair of Lightning Claws',prefix+'-pair','gear-pair-lightning-claws',pair_cost,1)
                  # Selecting the pair removes both ordinary replacement groups; selecting either replacement hides the pair.
                  for g in (pg,mg):
                      mod_set(g,'hidden','true',prefix+'-pair');mod_set(g,g.get('id')+'-max','0',prefix+'-pair')
                  for source in (pg.get('id'),mg.get('id')):
                      mod_set(pairg,'hidden','true',source,1);mod_set(pairg,pairg.get('id')+'-max','0',source,1)
              return pg,mg

          # 1) Legion Seeker Squad
          u=unit('Legion Seeker Squad','fa-seeker',155)
          model(u,'Legion Seekers (included)','fa-seeker-included',['4','5','4','4','1','4','1','8','3+'],default=4,minv=4,maxv=4)
          model(u,'Legion Seeker Sergeant','fa-seeker-sgt',['4','5','4','4','1','4','2','9','3+'],default=1,minv=1,maxv=1)
          model(u,'Additional Legion Seeker','fa-seeker-add',['4','5','4','4','1','4','1','8','3+'],maxv=5,pts=20)
          rule(u,'Standard Wargear','fa-seeker-std','Power Armour; Bolter; Bolt Pistol; Frag Grenades; Special Issue Ammunition.')
          rule(u,'Legiones Astartes','fa-seeker-la','Legiones Astartes; also has And They Shall Know No Fear as presented in ProHammer Classic and is not Fearless.')
          rule(u,'Infiltrate & Move Through Cover','fa-seeker-move','The squad has Infiltrate and Move Through Cover as defined in ProHammer Classic.')
          rule(u,'Marked for Death','fa-seeker-mark','After deployment, nominate one enemy unit for each Legion Seeker Squad. Against its nominated target, the squad re-rolls To Hit rolls of 1 and To Wound rolls of 1; against vehicles it re-rolls Armour Penetration rolls of 1 instead of To Wound rolls. If the target is destroyed, no new target is selected.')
          rule(u,'Special Issue Ammunition','fa-seeker-ammo-rule','Whenever the squad fires Bolters, Foeblaster Boltguns or the bolter component of Combi-weapons, choose one ammunition type for all eligible models: Dragonfire, Hellfire, Kraken or Vengeance. Use the profiles shown below.')
          for j,(n,v) in enumerate(ammo_profiles):profile(u,n,f'fa-seeker-ammo-{j}','prof-ranged',v)
          br=group(u,'Bolter Replacements','fa-seeker-bolter-repl',maxv=4)
          dynamic_max(br,'fa-seeker-bolter-repl-max','fa-seeker-add',[(1,5),(2,6),(3,7),(4,8),(5,9)])
          for n,t,c,s in [('Combi-Flamer','gear-combi-flamer',5,'cf'),('Combi-Volkite','gear-combi-volkite',5,'cv'),('Combi-Meltagun','gear-combi-melta',10,'cm'),('Combi-Plasma Gun','gear-combi-plasma',10,'cp')]:link(br,n+' (replaces Bolter)','fa-seeker-'+s,t,c,9)
          sg=group(br,'Special Weapons (maximum two)','fa-seeker-special',maxv=2)
          for n,t,c,s in [('Flamer','gear-flamer',5,'fl'),('Meltagun','gear-meltagun',10,'me'),('Plasma Gun','gear-plasma-gun',12,'pg'),('M.40 Targeter and Stalker Bolter',stalker,10,'m40'),('Heavy Bolter with Suspensor and Hellfire Rounds',seeker_hb,15,'hb'),('Volkite Charger','gear-volkite-charger',5,'vc'),('Volkite Caliver','gear-volkite-caliver',10,'vcal')]:link(sg,n+' (replaces Bolter)','fa-seeker-sp-'+s,t,c,2)
          eq=group(u,'Squad Equipment','fa-seeker-eq',maxv=1);link(eq,'Nuncio Vox','fa-seeker-nuncio','gear-nuncio',10,1)
          sw=group(u,'Squad-wide Equipment','fa-seeker-squad')
          squad_upgrade(sw,'Krak Grenades (+2 pts/model)','fa-seeker-krak','gear-krak',2,5,'fa-seeker-add')
          squad_upgrade(sw,'Melta Bombs (+5 pts/model)','fa-seeker-melta','gear-melta-bombs',5,5,'fa-seeker-add')
          ser=group(u,'Legion Seeker Sergeant','fa-seeker-sergeant')
          add_sergeant_weapons(ser,'fa-seeker-sgtw',seeker=True)
          # The Seeker entry says the Sergeant may take these rather than replacing a standard melee weapon.
          link(ser,'Melta Bombs','fa-seeker-sgt-melta','gear-melta-bombs',5,1)
          add_armoury(ser,'fa-seeker-sgt',[('Pair of Lightning Claws','gear-pair-lightning-claws',30),('Rending Weapon','gear-rending',5),('Thunder Hammer','gear-thunder',30)])
          tr=group(u,'Dedicated Transport','fa-seeker-transport',maxv=1)
          link(tr,'Rhino','fa-seeker-rhino','transport-rhino',0,1);link(tr,'Drop Pod','fa-seeker-pod','transport-drop-pod',0,1);link(tr,'Dreadclaw Drop Pod','fa-seeker-dreadclaw','transport-dreadclaw',0,1)

          # 2) Legion Bike Squadron
          u=unit('Legion Bike Squadron','fa-bike',90)
          model(u,'Legion Bikers (included)','fa-bike-included',['4','4','4','5','1','4','1','8','3+'],default=2,minv=2,maxv=2)
          model(u,'Legion Biker Sergeant','fa-bike-sgt',['4','4','4','5','1','4','2','9','3+'],default=1,minv=1,maxv=1)
          model(u,'Additional Legion Biker','fa-bike-add',['4','4','4','5','1','4','1','8','3+'],maxv=7,pts=30)
          rule(u,'Standard Wargear','fa-bike-std','Power Armour; Space Marine Bike with Twin-linked Bolters; Bolt Pistol; Chainsword; Frag Grenades.')
          rule(u,'Legiones Astartes','fa-bike-la','Legiones Astartes; also has And They Shall Know No Fear as presented in ProHammer Classic and is not Fearless.')
          sw=group(u,'Squad-wide Equipment','fa-bike-squad')
          squad_upgrade(sw,'Krak Grenades (+2 pts/model)','fa-bike-krak','gear-krak',2,3,'fa-bike-add');squad_upgrade(sw,'Melta Bombs (+5 pts/model)','fa-bike-melta','gear-melta-bombs',5,3,'fa-bike-add')
          sp=group(u,'Special Weapons — up to two Bikers replace Bolt Pistols','fa-bike-special',maxv=2)
          for n,t,c,s in [('Flamer','gear-flamer',5,'f'),('Meltagun','gear-meltagun',10,'m'),('Plasma Gun','gear-plasma-gun',15,'p')]:link(sp,n,'fa-bike-sp-'+s,t,c,2)
          bw=group(u,'Bike Weapons — entire squad','fa-bike-mounted',maxv=1)
          squad_upgrade(bw,'Twin-linked Flamers (+10 pts/model)','fa-bike-tlf',tl_flamer,10,3,'fa-bike-add');squad_upgrade(bw,'Twin-linked Meltaguns (+20 pts/model)','fa-bike-tlm',tl_melta,20,3,'fa-bike-add');squad_upgrade(bw,'Twin-linked Plasma Guns (+20 pts/model)','fa-bike-tlp',tl_plasma,20,3,'fa-bike-add')
          eq=group(u,'Squad Equipment — choose one','fa-bike-eq',maxv=1);link(eq,'Legion Vexilla','fa-bike-vex','gear-vexilla',10,1);link(eq,'Nuncio Vox','fa-bike-nuncio','gear-nuncio',10,1)
          ser=group(u,'Legion Biker Sergeant','fa-bike-sergeant');add_sergeant_weapons(ser,'fa-bike-sgtw',20,False);link(ser,'Melta Bombs','fa-bike-sgt-melta','gear-melta-bombs',5,1);add_armoury(ser,'fa-bike-sgt')

          # 3) Legion Sky Hunter Jetbike Squadron
          u=unit('Legion Sky Hunter Jetbike Squadron','fa-sky-hunter',150)
          model(u,'Legion Sky Hunters (included)','fa-sky-included',['4','4','4','5','1','4','1','8','2+'],default=2,minv=2,maxv=2)
          model(u,'Sky Hunter Sergeant','fa-sky-sgt',['4','4','4','5','1','4','2','9','2+'],default=1,minv=1,maxv=1)
          model(u,'Additional Legion Sky Hunter','fa-sky-add',['4','4','4','5','1','4','1','8','2+'],maxv=7,pts=35)
          rule(u,'Standard Wargear','fa-sky-std','Power Armour; Legion Scimitar Jetbike with Heavy Bolter; Bolt Pistol; Chainsword; Frag Grenades.')
          rule(u,'Legiones Astartes & Deep Strike','fa-sky-la','Legiones Astartes and Deep Strike. The unit also has And They Shall Know No Fear as presented in ProHammer Classic and is not Fearless.')
          sw=group(u,'Squad-wide Equipment','fa-sky-squad');squad_upgrade(sw,'Krak Grenades (+2 pts/model)','fa-sky-krak','gear-krak',2,3,'fa-sky-add');squad_upgrade(sw,'Melta Bombs (+5 pts/model)','fa-sky-melta','gear-melta-bombs',5,3,'fa-sky-add')
          jw=group(u,'Jetbike Weapons — one per three models','fa-sky-weapons',maxv=1)
          dynamic_max(jw,'fa-sky-weapons-max','fa-sky-add',[(3,2),(6,3)])
          for n,t,c,s in [('Multi-Melta','gear-multimelta',10,'mm'),('Volkite Culverin','gear-volkite-culverin',10,'vc'),('Plasma Cannon','gear-plasma-cannon',15,'pc')]:link(jw,n+' (replaces Heavy Bolter)','fa-sky-'+s,t,c,3)
          ser=group(u,'Sky Hunter Sergeant','fa-sky-sergeant');add_sergeant_weapons(ser,'fa-sky-sgtw',20,False);link(ser,'Melta Bombs','fa-sky-sgt-melta','gear-melta-bombs',5,1);add_armoury(ser,'fa-sky-sgt')

          # 4) Legion Attack Bike Squadron
          u=unit('Legion Attack Bike Squadron','fa-attack-bike')
          model(u,'Legion Attack Bike','fa-attack-bike-model',['4','4','4','5','2','4','1','8','3+'],default=1,minv=1,maxv=3,pts=40)
          rule(u,'Standard Wargear','fa-attack-bike-std','Power Armour; Legion Attack Bike with Twin-linked Bolters; Heavy Bolter; Bolt Pistol; Chainsword; Frag Grenades.')
          rule(u,'Legiones Astartes','fa-attack-bike-la','Legiones Astartes; also has And They Shall Know No Fear as presented in ProHammer Classic and is not Fearless.')
          wr=group(u,'Heavy Bolter Replacements','fa-attack-bike-weapons',maxv=1);dynamic_max(wr,'fa-attack-bike-weapons-max','fa-attack-bike-model',[(2,2),(3,3)])
          for n,t,c,s in [('Heavy Flamer','gear-heavy-flamer',0,'hf'),('Autocannon','gear-autocannon',5,'ac'),('Multi-Melta','gear-multimelta',10,'mm')]:link(wr,n,'fa-attack-bike-'+s,t,c,3)
          sw=group(u,'Squadron Equipment','fa-attack-bike-squad')
          for n,t,per,s in [('Krak Grenades (+2 pts/model)','gear-krak',2,'krak'),('Melta Bombs (+5 pts/model)','gear-melta-bombs',5,'melta')]:
              e=link(sw,n,'fa-attack-bike-'+s,t,0,1);repeat_cost(e,per,'fa-attack-bike-model')

          # 5) Legion Land Speeder Squadron
          u=unit('Legion Land Speeder Squadron','fa-land-speeder')
          model(u,'Legion Land Speeder','fa-land-speeder-model',['4','10','10','10'],default=1,minv=1,maxv=3,pts=50,vehicle=True)
          rule(u,'Standard Wargear','fa-land-speeder-std','Heavy Bolter.')
          rule(u,'Deep Strike','fa-land-speeder-ds','The squadron has Deep Strike as defined in ProHammer Classic.')
          rule(u,'Armoured Crew','fa-land-speeder-armoured','The crew are protected by Power Armour and the enclosed fighting position. A Legion Land Speeder does not count as Open-topped.')
          wr=group(u,'Heavy Bolter Replacements','fa-land-speeder-primary',maxv=1);dynamic_max(wr,'fa-land-speeder-primary-max','fa-land-speeder-model',[(2,2),(3,3)])
          for n,t,c,s in [('Heavy Flamer','gear-heavy-flamer',0,'hf'),('Multi-Melta','gear-multimelta',10,'mm'),('Volkite Culverin','gear-volkite-culverin',10,'vc')]:link(wr,n,'fa-land-speeder-pr-'+s,t,c,3)
          aw=group(u,'Additional Weapons — one per Speeder','fa-land-speeder-additional',maxv=1);dynamic_max(aw,'fa-land-speeder-additional-max','fa-land-speeder-model',[(2,2),(3,3)])
          for n,t,c,s in [('Heavy Flamer','gear-heavy-flamer',10,'hf'),('Heavy Bolter','gear-heavy-bolter',10,'hb'),('Havoc Launcher',havoc,15,'hav'),('Graviton Gun','gear-graviton-gun',15,'grav'),('Assault Cannon',assault,20,'ac'),('Plasma Cannon','gear-plasma-cannon',25,'pc'),('Typhoon Missile Launcher',typhoon,25,'typ')]:link(aw,n,'fa-land-speeder-add-'+s,t,c,3)
          hkgrp=group(u,'Hunter-Killer Missiles — up to two per Speeder','fa-land-speeder-hk',maxv=2);dynamic_max(hkgrp,'fa-land-speeder-hk-max','fa-land-speeder-model',[(2,4),(3,6)]);link(hkgrp,'Hunter-Killer Missile','fa-land-speeder-hk-item',hk,5,6)

          # 6) Legion Javelin Attack Speeder Squadron
          u=unit('Legion Javelin Attack Speeder Squadron','fa-javelin')
          model(u,'Javelin Attack Speeder','fa-javelin-model',['4','11','11','10'],default=1,minv=1,maxv=3,pts=75,vehicle=True)
          rule(u,'Standard Wargear','fa-javelin-std','Heavy Bolter; Twin-linked Cyclone Missile Launcher.')
          rule(u,'Deep Strike & Outflank','fa-javelin-deploy','The squadron has Deep Strike and Outflank as defined in ProHammer Classic.')
          rule(u,'Strafing Run','fa-javelin-strafe','When shooting Assault, Heavy, Rapid Fire or Salvo weapons at ground units that are not Flyers or Skimmers, the vehicle gains +1 Ballistic Skill and all such shots count as Pinning, as defined in ProHammer Classic.')
          rule(u,'Armoured Crew','fa-javelin-armoured','A Javelin Attack Speeder does not count as Open-topped.')
          wr=group(u,'Cyclone Missile Launcher Replacement','fa-javelin-cyclone',maxv=1);dynamic_max(wr,'fa-javelin-cyclone-max','fa-javelin-model',[(2,2),(3,3)]);link(wr,'Twin-linked Lascannon','fa-javelin-tllas',tl_las,10,3)
          pr=group(u,'Heavy Bolter Replacement','fa-javelin-primary',maxv=1);dynamic_max(pr,'fa-javelin-primary-max','fa-javelin-model',[(2,2),(3,3)]);link(pr,'Heavy Flamer','fa-javelin-hf','gear-heavy-flamer',0,3);link(pr,'Multi-Melta','fa-javelin-mm','gear-multimelta',10,3)
          eq=group(u,'Vehicle Equipment','fa-javelin-eq',maxv=1);dynamic_max(eq,'fa-javelin-eq-max','fa-javelin-model',[(2,2),(3,3)])
          search=upgrade(eq,'Searchlight','fa-javelin-search',1,3);rule(search,'Searchlight','fa-javelin-search-rule','When Night Fighting is in effect, the vehicle may illuminate itself and a chosen target, negating the effects of Night Fighting for those models as described in ProHammer Classic.')
          hkgrp=group(u,'Hunter-Killer Missiles — up to two per Speeder','fa-javelin-hk',maxv=2);dynamic_max(hkgrp,'fa-javelin-hk-max','fa-javelin-model',[(2,4),(3,6)]);link(hkgrp,'Hunter-Killer Missile','fa-javelin-hk-item',hk,5,6)

          # Catalogue metadata.
          root.set('revision',str(int(root.get('revision','17'))+1))
          comment=root.find(Q('comment'))
          if comment is None:comment=sub(root,'comment')
          comment.text='Revision 18: Added the complete core Fast Attack section: Legion Seekers, Bikes, Sky Hunters, Attack Bikes, Land Speeders and Javelin Attack Speeders, using shared weapon/transport links and source-accurate points and options.'
          readme=root.find(Q('readme'))
          if readme is not None:readme.text='Core Troops, Elites and Fast Attack entries follow the current Legiones Astartes Army List. Shared weapons and transports are reused through links rather than duplicated. Unit-specific replacements take precedence over generic Armoury access, squad-wide upgrades suppress redundant character purchases where practical, and items may not be selected more than once unless specifically permitted.'

          # Validation: unique XML IDs and no duplicate direct names/targets in any option group.
          ids=[]
          for e in root.iter():
              if e.get('id'):ids.append(e.get('id'))
          dup=[i for i,c in Counter(ids).items() if c>1]
          if dup:raise SystemExit('Duplicate XML IDs: '+', '.join(dup[:20]))
          bad=[]
          for g in root.iter(Q('selectionEntryGroup')):
              links=g.find(Q('entryLinks'))
              if links is None:continue
              ns=[x.get('name') for x in links.findall(Q('entryLink'))]; ts=[x.get('targetId') for x in links.findall(Q('entryLink'))]
              dn=[n for n,c in Counter(ns).items() if c>1];dt=[t for t,c in Counter(ts).items() if c>1]
              if dn or dt:bad.append((g.get('name'),dn,dt))
          if bad:raise SystemExit('Duplicate direct options: '+repr(bad[:20]))

          ET.indent(tree,space='  ')
          tree.write(PATH,encoding='UTF-8',xml_declaration=True)
          print('Fast Attack build complete; revision',root.get('revision'))
