name: R86 Diagnose World Eaters
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/r86_diag_world_eaters.py'
      - '.github/workflows/r86-diag-world-eaters.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Diagnose World Eaters
        run: python .github/build/r86_diag_world_eaters.py
      - name: Commit diagnostic
        run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add inspection-r86-world-eaters-diagnostic.txt
          git diff --cached --quiet || git commit -m 'Revision 86 diagnostic: audit World Eaters'
          git pull --rebase origin main
          git push
