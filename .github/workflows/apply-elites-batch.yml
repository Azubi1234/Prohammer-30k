              rule(u,'Dual Pistols','destroyer-dual','A model with this rule may fire both of its Pistol weapons during the Shooting phase. Both pistols must be fired at the same target. If it fires both pistols, it may not fire another weapon during that Shooting phase.')
              rule(u,'Destroyer Cadre','destroyer-cadre','A Legion Destroyer Squad may only be joined by an Independent Character with the Legion Moritat Consul upgrade. No other Independent Character may join the squad.')
              rule(u,'Rad Grenades','destroyer-rad','During any player turn in which the unit charges or is itself charged, enemy non-vehicle models engaged with it suffer -1 Toughness until the end of the Assault phase. This affects Instant Death and is not cumulative.')
              fixed_model(u,'Legion Destroyers (included)','destroyer-included',4,('4','4','4','4','1','4','1','9','3+'))
              fixed_model(u,'Legion Destroyer Sergeant','destroyer-sergeant',1,('4','4','4','4','1','4','2','9','3+'))
