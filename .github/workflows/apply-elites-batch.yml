              def add_servo(parent, techprefix, n):
                  sid=f'{techprefix}-servo-{n}'
                  s=selection(box(parent,'selectionEntries'),'model',f'Servo-automata {n}',sid)
                  constraint(s,sid+'-max','max',1,include=False); cost(s,12)
                  model_profile(s,'Servo-automata',sid+'-prof','3','3','4','5','1','1','1','6','5+')
                  rule(s,'Standard Wargear',sid+'-std','Bolter and Chainsword.')
                  rule(s,'Cybernetica',sid+'-cyber','At the beginning of each friendly Movement phase, Servo-automata not accompanied by a Legion Techmarine must take a Pinning test. If already engaged in close combat, they do not take this test and fight normally.')
                  rg=group(s,'Bolter Replacement',sid+'-ranged',maxv=1)
                  for nm,xid,target,pts in [('Flamer','flamer','gear-flamer',5),('Rotor Cannon','rotor','gear-rotor',5),('Heavy Bolter','hb','gear-heavy-bolter',10),('Multi-Melta','mm','gear-multimelta',10),('Missile Launcher','ml','gear-missile',15)]: link(rg,nm,sid+'-'+xid,target,pts,1)
                  mg=group(s,'Chainsword Replacement',sid+'-melee',maxv=1); link(mg,'Power Fist',sid+'-pf','gear-power-fist',15,1)
                  r=local_upgrade(s,'Rad Missiles (requires Missile Launcher and Techmarine Rad Grenades)',sid+'-rad',10,1)
                  rule(r,'Rad Missiles',sid+'-rad-rule','Legal only if this Servo-automata has a Missile Launcher and its Legion Techmarine is equipped with Rad Grenades. Replace the Missile Launcher\'s Frag and Krak Missiles with Rad Missiles: 48", S4, AP3, Heavy 1, Blast, Fleshbane, Rad-phage. A surviving model that suffers an unsaved Wound from Rad-phage loses 1 Toughness for the rest of the battle, minimum 1; cumulative.')
                  return s

              def add_tech(slot, mandatory=False):
                  sid=f'techmarine-{slot}'
                  t=selection(ss,'model',f'Legion Techmarine {slot}',sid,1 if mandatory else None)
                  if mandatory: constraint(t,sid+'-min','min',1,include=False,automatic='true')
                  constraint(t,sid+'-max','max',1,include=False)
                  cost(t,50); model_profile(t,'Legion Techmarine',sid+'-prof','4','4','4','4','1','4','1','9','3+')
                  rule(t,'Standard Wargear',sid+'-std','Power Armour, Bolt Pistol, Power Weapon, Servo-Arm and Frag Grenades.')
                  rule(t,'Legiones Astartes',sid+'-legiones','Legiones Astartes; also has And They Shall Know No Fear as presented in ProHammer Classic and is not Fearless.')
                  rule(t,'Independent Character',sid+'-ic','The Legion Techmarine is an Independent Character, subject to Field Team while accompanied by Servo-automata.')
                  rule(t,'Servo-Arm',sid+'-servoarm','Grants an additional Power Fist-style close-combat attack rolled separately and provides +1 to Battlesmith repair rolls. The normal Battlesmith 5+ therefore succeeds on a 4+ while the Servo-Arm is retained.')
                  rule(t,'Battlesmith',sid+'-battlesmith','Instead of firing in the Shooting phase, while in base contact with an eligible friendly Vehicle, Cybernetica Cortex model or Iron and Machine model, roll a D6. On a 5+, remove one Engine Damaged, restore one Weapon Destroyed, remove one Immobilised result, or restore one lost Wound to an eligible non-vehicle up to its starting Wounds. One attempt per turn; a model may benefit from only one successful repair per turn. Destroyed models cannot be returned. Daemons may not normally be repaired.')
                  rule(t,'Bolster Defences',sid+'-bolster','Before either army deploys, nominate one ruin or similar defensive terrain feature wholly or partially within the army\'s deployment zone. Improve its Cover Save by 1 to a maximum of 3+. A terrain feature may only be Bolstered once.')
                  rule(t,'Field Team',sid+'-field','If accompanied by one or more Servo-automata, the Techmarine and his Servo-automata form one Field Team. The Techmarine may not voluntarily leave while any Servo-automata remain alive. The whole Field Team may join and leave friendly units as though the Techmarine were an Independent Character. If he is slain, surviving Servo-automata form a unit and become subject to Cybernetica.')
                  wg=group(t,'Wargear',sid+'-wargear')
                  for nm,xid,target,pts in [('Auspex','auspex','gear-auspex',2),('Melta Bombs','melta','gear-melta-bombs',5),('Nuncio Vox','nuncio','gear-nuncio',10),('Rad Grenades','rad','gear-rad-grenades',10),('Krak Grenades','krak','gear-krak',2)]: link(wg,nm,sid+'-'+xid,target,pts,1)
                  sg=local_upgrade(wg,'Signum',sid+'-signum',15,1); rule(sg,'Signum',sid+'-signum-rule','Once during each friendly Shooting phase, a unit containing a Signum may re-roll one failed To Hit roll made with a shooting weapon. A unit may benefit from only one Signum each Shooting phase.')
                  pg=group(t,'Bolt Pistol Replacement',sid+'-pistol',maxv=1)
                  link(pg,'Volkite Serpenta',sid+'-vs','gear-volkite-serpenta',5,1); link(pg,'Plasma Pistol',sid+'-pp','gear-plasma-pistol',15,1)
                  mg=group(t,'Power Weapon Replacement',sid+'-melee',maxv=1); link(mg,'Thunder Hammer',sid+'-th','gear-thunder',15,1)
                  ag=group(t,'Additional Weapon (choose up to one)','%s-additional'%sid,maxv=1)
                  for nm,xid,target,pts in [('Bolter','bolter','gear-bolter',2),('Combi-Flamer','cf','gear-combi-flamer',10),('Combi-Volkite Charger','cv','gear-combi-volkite',10),('Combi-Meltagun','cm','gear-combi-melta',15),('Combi-Plasma Gun','cp','gear-combi-plasma',15),('Volkite Charger','vc','gear-volkite-charger',10),('Graviton Gun','grav','gear-graviton-gun',15),('Volkite Caliver','vcal','gear-volkite-caliver',15),('Rotor Cannon','rotor','gear-rotor',4)]: link(ag,nm,sid+'-'+xid,target,pts,1)
                  sa=group(t,'Servo-Arm Replacement',sid+'-servo-replace',maxv=1)
                  cb=link(sa,'Conversion Beamer',sid+'-conversion','gear-conversion-beamer',35,1); rule(cb,'Servo-Arm Replacement',sid+'-conversion-rule','Replacing the Servo-Arm removes both the additional close-combat attack and the +1 bonus to Battlesmith normally provided by the Servo-Arm.')
                  bike=local_upgrade(wg,'Space Marine Bike',sid+'-bike',35,1); rule(bike,'Space Marine Bike',sid+'-bike-rule','The model becomes Bike and the bike is armed with twin-linked bolters.')
                  for n in range(1,5): add_servo(t,sid,n)
