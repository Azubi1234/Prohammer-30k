                  mod_set(tr,'hidden','true',sid+'-bike','atLeast',1,scope='parent',include=True); mod_set(tr,sid+'-transport-max',0,sid+'-bike','atLeast',1,scope='parent',include=True)
                  rule(t,'Dedicated Transport',sid+'-transport-rule','If not equipped with a Space Marine Bike, this Techmarine may select a Rhino. If accompanied by Servo-automata, the Rhino is purchased for the entire Field Team.')
                  return t

              add_tech('I',True); add_tech('II',False); add_tech('III',False)
              existing.add('techmarine-covenant')

          # ---------- DREADNOUGHT HELPERS ----------
          def arm_choice(g,name,sid,points,profiles=(),rules=(),default=False):
              x=local_upgrade(g,name,sid,points,1,1 if default else None)
              for idx,(pn,rng,s,ap,typ) in enumerate(profiles): ranged_profile(x,pn,sid+f'-prof-{idx}',rng,s,ap,typ)
              for idx,(rn,txt) in enumerate(rules): rule(x,rn,sid+f'-rule-{idx}',txt)
              return x

          def add_dread_common(u,prefix,primary,secondary,contemptor=False):
              pg=group(u,'Primary Arm',prefix+'-primary',minv=1,maxv=1)
              for spec in primary: arm_choice(pg,*spec)
              sg=group(u,'Secondary Arm',prefix+'-secondary',minv=1,maxv=1)
              for spec in secondary: arm_choice(sg,*spec)
              # Built-in weapon replacement choices are explicit replacements, not additional weapons.
              for which,armids in [('primary',[prefix+'-p-dccw']),('secondary',[prefix+'-s-dccw',prefix+'-s-chainfist'])]:
                  bg=group(u,which.title()+' Arm Built-in Weapon Replacement',prefix+'-'+which+'-built',maxv=1)
                  for nm,xid,target,pts in [('Heavy Flamer','hf','gear-heavy-flamer',10),('Meltagun','melta','gear-meltagun',15),('Graviton Gun','grav','gear-graviton-gun',15),('Plasma Blaster','pb','gear-plasma-blaster',20)]: link(bg,nm+' (replaces built-in Twin-linked Bolter)',prefix+'-'+which+'-'+xid,target,pts,1)
                  # Hide unless a compatible close-combat arm is selected.
                  # Hidden by default; any compatible arm unhides it.
                  bg.set('hidden','true')
                  for aid in armids: mod_set(bg,'hidden','false',aid,'atLeast',1)
              vg=group(u,'Vehicle Upgrades',prefix+'-vehicle')
              ex=local_upgrade(vg,'Extra Armour',prefix+'-extra',5,1); rule(ex,'Extra Armour',prefix+'-extra-rule','Crew Stunned results are treated as Crew Shaken instead.')
              hk=local_upgrade(vg,'Hunter-Killer Missile',prefix+'-hk',5,2); ranged_profile(hk,'Hunter-Killer Missile',prefix+'-hk-prof','Unlimited','8','3','Heavy 1, One Use')
              hv=link(vg,'Havoc Launcher',prefix+'-havoc','gear-havoc',15,1)
              tr=group(u,'Dedicated Transport',prefix+'-transport',maxv=1); link(tr,'Legion Dreadnought Drop Pod',prefix+'-dreadpod','transport-dreadnought-pod',0,1)

          # ---------- LEGION DREADNOUGHT ----------
          if 'dreadnought-unit' not in existing:
              u=selection(top,'unit','Legion Dreadnought','dreadnought-unit'); cat_elite(u,'dreadnought-unit'); cost(u,105)
              walker_profile(u,'Legion Dreadnought','dreadnought-prof','4','4','6','12','12','10','4','2')
              rule(u,'Standard Wargear','dreadnought-standard','Twin-linked Heavy Bolter; Dreadnought Close Combat Weapon with built-in Twin-linked Bolter; Smoke Launchers; Searchlight.')
              rule(u,'Paired Close-Combat Arms','dreadnought-paired','If the Legion Dreadnought retains two Dreadnought Close Combat Weapons, it gains +1 Attack. This bonus is not included in the profile.')
              primary=[
                ('Twin-linked Heavy Bolter','dreadnought-p-tlhb',0,[('Twin-linked Heavy Bolter','36"','5','4','Heavy 3, Twin-linked')],[],True),
