name: Apply Legiones Astartes Elites batch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Elites from current army list
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from collections import Counter

          CAT = Path('Legiones Astartes.cat')
          GST = Path('Prohammer 30k.gst')
          NS = 'http://www.battlescribe.net/schema/catalogueSchema'
          ET.register_namespace('', NS)
          Q = lambda t: f'{{{NS}}}{t}'

          tree = ET.parse(CAT)
          root = tree.getroot()
          if root.get('revision') != '15' or root.get('gameSystemRevision') != '5':
              raise SystemExit(f'Unexpected catalogue revision state: {root.get("revision")}/{root.get("gameSystemRevision")}')

          existing = {e.get('id') for e in root.iter() if e.get('id')}
          shared = root.find(Q('sharedSelectionEntries'))
          top = root.find(Q('selectionEntries'))
          if shared is None or top is None:
              raise SystemExit('Catalogue containers missing')

          def sub(p, tag, **attrs):
              attrs = {k: str(v).lower() if isinstance(v, bool) else str(v) for k,v in attrs.items() if v is not None}
              return ET.SubElement(p, Q(tag), attrs)

          def box(p, tag):
              x = p.find(Q(tag))
              if x is None:
                  x = sub(p, tag)
              return x

          def cost(p, value):
              c = box(p, 'costs')
              sub(c, 'cost', name='Points', typeId='pts', value=value)

          def constraint(p, cid, typ='max', value=1, field='selections', scope='parent', include=False, automatic=None):
              cs = box(p, 'constraints')
              return sub(cs, 'constraint', id=cid, type=typ, value=value, field=field, scope=scope,
                         shared='true', includeChildSelections=str(include).lower(), automatic=(str(automatic).lower() if automatic is not None else None))

          def condition(mod, typ, value, child, scope='root-entry', include=True):
              cs = box(mod, 'conditions')
              sub(cs, 'condition', type=typ, value=value, field='selections', scope=scope, childId=child,
                  shared='true', includeChildSelections=str(include).lower())

          def mod_set(p, field, value, cond_child, cond_type='atLeast', cond_value=1, scope='root-entry', include=True):
              ms = box(p, 'modifiers')
              m = sub(ms, 'modifier', type='set', value=value, field=field)
              condition(m, cond_type, cond_value, cond_child, scope, include)
              return m

          def mod_repeat(p, field, value, child, scope='root-entry', include=False):
              ms = box(p, 'modifiers')
              m = sub(ms, 'modifier', type='increment', value=value, field=field)
              rs = sub(m, 'repeats')
              sub(rs, 'repeat', value='1', repeats='1', field='selections', scope=scope, childId=child,
                  shared='true', roundUp='false', includeChildSelections=str(include).lower())
              return m

          def rule(p, name, rid, text):
              rs = box(p, 'rules')
              r = sub(rs, 'rule', name=name, id=rid, hidden='false')
              d = sub(r, 'description'); d.text = text
              return r

          def model_profile(p, name, pid, ws, bs, s, t, w, i, a, ld, sv):
              ps = box(p, 'profiles')
              pr = sub(ps, 'profile', name=name, id=pid, typeId='prof-model', typeName='Model', hidden='false')
              ch = sub(pr, 'characteristics')
              for n,tid,val in [('WS','model-ws',ws),('BS','model-bs',bs),('S','model-s',s),('T','model-t',t),('W','model-w',w),('I','model-i',i),('A','model-a',a),('Ld','model-ld',ld),('Sv','model-sv',sv)]:
                  e=sub(ch,'characteristic',name=n,typeId=tid); e.text=str(val)
              return pr

          def walker_profile(p, name, pid, ws, bs, s, front, side, rear, i, a):
              ps=box(p,'profiles'); pr=sub(ps,'profile',name=name,id=pid,typeId='prof-walker',typeName='Walker',hidden='false')
              ch=sub(pr,'characteristics')
              for n,tid,val in [('WS','walker-ws',ws),('BS','walker-bs',bs),('S','walker-s',s),('Front','walker-front',front),('Side','walker-side',side),('Rear','walker-rear',rear),('I','walker-i',i),('A','walker-a',a)]:
                  e=sub(ch,'characteristic',name=n,typeId=tid); e.text=str(val)
              return pr

          def vehicle_profile(p, name, pid, bs, front, side, rear):
              ps=box(p,'profiles'); pr=sub(ps,'profile',name=name,id=pid,typeId='prof-vehicle',typeName='Vehicle',hidden='false')
              ch=sub(pr,'characteristics')
              for n,tid,val in [('BS','vehicle-bs',bs),('Front','vehicle-front',front),('Side','vehicle-side',side),('Rear','vehicle-rear',rear)]:
                  e=sub(ch,'characteristic',name=n,typeId=tid); e.text=str(val)
              return pr

          def ranged_profile(p, name, pid, rng, s, ap, typ):
              ps=box(p,'profiles'); pr=sub(ps,'profile',name=name,id=pid,typeId='prof-ranged',typeName='Ranged Weapon',hidden='false')
              ch=sub(pr,'characteristics')
              for n,tid,val in [('Range','ranged-range',rng),('S','ranged-s',s),('AP','ranged-ap',ap),('Type','ranged-type',typ)]:
                  e=sub(ch,'characteristic',name=n,typeId=tid); e.text=str(val)
              return pr

          def cat_elite(u, uid):
              cl=box(u,'categoryLinks'); sub(cl,'categoryLink',targetId='cat-elites',id=uid+'-cat',primary='true',name='Elites',hidden='false')

          def selection(p, typ, name, sid, amount=None, hidden='false'):
              attrs=dict(type=typ,import='true',name=name,hidden=hidden,id=sid)
              if amount is not None: attrs['defaultAmount']=amount
              return sub(p,'selectionEntry',**attrs)

          def group(p, name, gid, minv=None, maxv=None, include=True):
              gs=box(p,'selectionEntryGroups'); g=sub(gs,'selectionEntryGroup',name=name,id=gid,hidden='false')
              if minv is not None: constraint(g,gid+'-min','min',minv,include=include)
              if maxv is not None: constraint(g,gid+'-max','max',maxv,include=include)
              return g

          def link(p, name, lid, target, points=0, maxv=1, amount=None):
              ls=box(p,'entryLinks'); attrs=dict(import='true',name=name,hidden='false',id=lid,type='selectionEntry',targetId=target)
              if amount is not None: attrs['defaultAmount']=amount
              l=sub(ls,'entryLink',**attrs)
              if maxv is not None: constraint(l,lid+'-max','max',maxv,include=False)
              if points: cost(l,points)
              return l

          def local_upgrade(p, name, sid, points=0, maxv=1, amount=None):
              ss=box(p,'selectionEntries'); s=selection(ss,'upgrade',name,sid,amount)
              if maxv is not None: constraint(s,sid+'-max','max',maxv,include=False)
              if points: cost(s,points)
              return s

          def add_shared_ranged(sid,name,profiles,rules=()):
              if sid in existing: return
              e=selection(shared,'upgrade',name,sid)
              for idx,(pn,rng,s,ap,typ) in enumerate(profiles): ranged_profile(e,pn,f'{sid}-prof-{idx}',rng,s,ap,typ)
              for idx,(rn,txt) in enumerate(rules): rule(e,rn,f'{sid}-rule-{idx}',txt)
              existing.add(sid)

          def add_shared_rule(sid,name,rules):
              if sid in existing: return
              e=selection(shared,'upgrade',name,sid)
              for idx,(rn,txt) in enumerate(rules): rule(e,rn,f'{sid}-rule-{idx}',txt)
              existing.add(sid)

          # ---------- Shared additions required by Elites ----------
          add_shared_ranged('gear-foeblaster','Foeblaster Boltgun',[
              ('Foeblaster Boltgun','18"','5','4','Rapid Fire, Twin-linked')])
          add_shared_ranged('gear-heavy-flamer-susp','Heavy Flamer with Suspensor Web',[
              ('Heavy Flamer with Suspensor Web','Template','5','4','Assault 1')],
              [('Suspensor Web','A Heavy weapon fitted with a Suspensor Web may instead be fired as an Assault weapon at half its normal maximum range. Its number of shots and all other characteristics are unchanged.')])
          add_shared_ranged('gear-heavy-bolter-susp','Heavy Bolter with Suspensor Web',[
              ('Heavy Bolter with Suspensor Web','18"','5','4','Assault 3')])
          add_shared_ranged('gear-missile-susp','Missile Launcher with Suspensor Web',[
              ('Missile Launcher with Suspensor Web - Frag','24"','4','6','Assault 1, Blast'),
              ('Missile Launcher with Suspensor Web - Krak','24"','8','3','Assault 1')])
          add_shared_rule('gear-chainfist','Chainfist',[
              ('Chainfist','Strength x2; Power Weapon; Unwieldy; Specialist Weapon; Armourbane.')])
          add_shared_ranged('gear-reaper-autocannon','Reaper Autocannon',[
              ('Reaper Autocannon','36"','7','4','Heavy 2, Twin-linked')])
          add_shared_ranged('gear-plasma-blaster','Plasma Blaster',[
              ('Plasma Blaster','18"','7','2','Assault 2, Gets Hot')])
          add_shared_ranged('gear-assault-cannon','Assault Cannon',[
              ('Assault Cannon','24"','6','4','Heavy 3, Rending')])
          add_shared_ranged('gear-kheres','Kheres Assault Cannon',[
              ('Kheres Assault Cannon','24"','6','4','Heavy 6, Rending')])
          add_shared_ranged('gear-cyclone','Cyclone Missile Launcher',[
              ('Cyclone Missile Launcher - Frag','48"','4','6','Heavy 2, Blast'),
              ('Cyclone Missile Launcher - Krak','48"','8','3','Heavy 2')],
              [('Cyclone Missile Launcher','The bearer may fire the Cyclone Missile Launcher while retaining its combi-bolter and close-combat weapon.')])
          add_shared_ranged('gear-grenade-harness','Grenade Harness',[
              ('Grenade Harness','8"','3','-','Assault 2, Blast, One Use')],
              [('Grenade Harness','May only be fired once per battle. If fired during the Shooting phase, the bearer and any unit it has joined count as equipped with Frag Grenades during the following Assault phase.')])
          add_shared_rule('gear-rad-grenades','Rad Grenades',[
              ('Rad Grenades','Rad Grenades are neither Assault nor Defensive Grenades. During any player turn in which a unit equipped with Rad Grenades charges, or is itself charged, enemy non-vehicle models engaged with that unit suffer -1 Toughness until the end of the Assault phase. This affects Instant Death and is not cumulative.')])
          add_shared_ranged('gear-rad-missile','Missile Launcher with Suspensor Web and Rad Missiles',[
              ('Rad Missile','48"','4','3','Heavy 1, Blast, Fleshbane, Rad-phage')],
              [('Rad-phage','If a model suffers one or more unsaved Wounds from a weapon with Rad-phage and survives, reduce its Toughness by 1 for the remainder of the battle, to a minimum of 1. Multiple applications are cumulative.'),
               ('Rad Missiles Only','A Missile Launcher equipped with Rad Missiles may only fire Rad Missiles and may not use Frag or Krak Missiles.')])
          add_shared_ranged('gear-phosphex-bomb','Phosphex Bomb',[
              ('Phosphex Bomb','6"','5','2','Assault 1, Blast, One Use, Poisoned (3+), Lingering Death')],
              [('Lingering Death','After resolving the attack, leave the Blast marker in place. For the remainder of the battle, the area beneath the marker counts as Dangerous Terrain for non-vehicle models and Open-topped vehicles.')])
          add_shared_ranged('gear-volkite-culverin','Volkite Culverin',[
              ('Volkite Culverin','45"','6','5','Heavy 4, Rending')])
          add_shared_ranged('gear-conversion-beamer','Conversion Beamer',[
              ('Conversion Beamer 0-18"','0-18"','6','-','Heavy 1, Blast'),
              ('Conversion Beamer 18-42"','18-42"','8','4','Heavy 1, Blast'),
              ('Conversion Beamer 42-72"','42-72"','10','1','Heavy 1, Blast')])
          add_shared_ranged('gear-heavy-conversion-beamer','Heavy Conversion Beamer',[
              ('Heavy Conversion Beamer 0-18"','0-18"','6','-','Heavy 1, Large Blast, Firing Calibration'),
              ('Heavy Conversion Beamer 18-42"','18-42"','8','4','Heavy 1, Large Blast, Firing Calibration'),
              ('Heavy Conversion Beamer 42-72"','42-72"','10','1','Heavy 1, Large Blast, Firing Calibration')])
          add_shared_ranged('gear-graviton-cannon','Graviton Cannon',[
              ('Graviton Cannon','36"','Special','4','Heavy 1, Large Blast, Concussive, Graviton')],
              [('Graviton','Against non-vehicle models, the number required To Wound is equal to the target\'s Armour Save. Against vehicles, do not make a normal Armour Penetration roll; roll a D6 for each hit and on a 6 the vehicle is Immobilised.')])
          add_shared_ranged('gear-laser-destroyer','Laser Destroyer',[
              ('Laser Destroyer','48"','10','1','Heavy 1, Twin-linked')])
          add_shared_ranged('gear-quad-heavy-bolter','Quad Heavy Bolter',[
              ('Quad Heavy Bolter','36"','5','4','Heavy 6, Twin-linked')])

          # Dreadnought Drop Pod, shared transport.
          if 'transport-dreadnought-pod' not in existing:
              pod=selection(shared,'model','Legion Dreadnought Drop Pod','transport-dreadnought-pod')
              vehicle_profile(pod,'Dreadnought Drop Pod','prof-dreadnought-pod','4','12','12','12')
              cost(pod,65)
              rule(pod,'Transport Capacity','dreadpod-cap','One Legion Dreadnought or Legion Contemptor Dreadnought. The transported Dreadnought occupies the vehicle\'s entire Transport Capacity.')
              rule(pod,'Deep Strike','dreadpod-deep','Uses the normal ProHammer Deep Strike rules together with Drop Pod Assault and Inertial Guidance System.')
              rule(pod,'Drop Pod Assault','dreadpod-assault','Use the Drop Pod Assault rule given in the Legion Drop Pod entry.')
              rule(pod,'Inertial Guidance System','dreadpod-igs','Use the Inertial Guidance System rule given in the Legion Drop Pod entry.')
              rule(pod,'Immobile','dreadpod-immobile','After arriving, the Dreadnought Drop Pod may not move for the remainder of the battle.')
              rule(pod,'Burning Retros','dreadpod-retros','From arrival by Deep Strike until the start of its controlling player\'s next turn, the Drop Pod has Shrouded. A Dreadnought disembarking during this period also has Shrouded until that time. In addition, during this period, a unit targeted by shooting gains Shrouded if the attacker\'s line of sight passes through or over the Dreadnought Drop Pod.')
              rule(pod,'Assault Vehicle','dreadpod-assaultveh','A Dreadnought may charge during a turn in which it disembarks from this Drop Pod, but may not charge during the same turn in which the Drop Pod itself arrived by Deep Strike.')
              existing.add('transport-dreadnought-pod')

          # ---------- Generic helpers for squad construction ----------
          def fixed_model(unit, name, sid, amount, profile_args):
              ss=box(unit,'selectionEntries'); m=selection(ss,'model',name,sid,amount)
              constraint(m,sid+'-min','min',amount,include=False,automatic='true')
              constraint(m,sid+'-max','max',amount,include=False,automatic='true')
              model_profile(m,name,sid+'-prof',*profile_args)
              return m

          def additional_model(unit,name,sid,maxv,points,profile_args):
              ss=box(unit,'selectionEntries'); m=selection(ss,'model',name,sid)
              constraint(m,sid+'-max','max',maxv,include=False)
              cost(m,points); model_profile(m,name,sid+'-prof',*profile_args)
              return m

          def dynamic_squad_entry(g, name, sid, target, base_points, each_extra, extra_id, maxv=1):
              l=link(g,name,sid,target,base_points,maxv)
              if each_extra: mod_repeat(l,'pts',each_extra,extra_id)
              return l

          def qty_link(g,name,sid,target,points,group_constraint_id=None,base_max=10):
              l=link(g,name,sid,target,points,base_max)
              return l

          def armory_points_group(unit, name, gid):
              g=group(unit,name,gid,maxv=None)
              constraint(g,gid+'-pts-max','max',50,field='pts',include=True)
              return g

          # ---------- LEGION VETERAN SQUAD ----------
          if 'veteran-unit' not in existing:
              u=selection(top,'unit','Legion Veteran Squad','veteran-unit'); cat_elite(u,'veteran-unit')
              rule(u,'Standard Wargear','veteran-standard','Every model is equipped with Power Armour, a Bolter, Bolt Pistol, Chainsword and Frag Grenades unless replaced by an option below.')
              rule(u,'Legiones Astartes','veteran-legiones','All models have the Legiones Astartes special rule and And They Shall Know No Fear as presented in ProHammer Classic. They are not Fearless.')
              rule(u,'Veteran Tactics','veteran-tactics-rule','When constructing the army, select one Veteran Tactic for this squad. The chosen ability applies to every model in the squad for the duration of the battle.')
              fixed_model(u,'Legion Veterans (included)','veteran-included',4,('5','4','4','4','1','4','2','9','3+'))
              fixed_model(u,'Legion Veteran Sergeant','veteran-sergeant',1,('5','4','4','4','1','4','2','9','3+'))
              additional_model(u,'Additional Legion Veteran','veteran-additional',5,20,('5','4','4','4','1','4','2','9','3+'))
              cost(u,125)

              tg=group(u,'Veteran Tactic (choose one)','veteran-tactics',minv=1,maxv=1)
              tactics=[('Resolve','veteran-tactic-resolve','Stubborn'),('Assault Veterans','veteran-tactic-assault','Furious Charge'),('Counter-Assault','veteran-tactic-counter','Counter-Attack'),('Machine Killers','veteran-tactic-machine','Tank Hunters'),('Recon Veterans','veteran-tactic-recon','Infiltrate')]
              for nm,sid,rr in tactics:
                  x=local_upgrade(tg,nm,sid,0,1); rule(x,nm,sid+'-rule',f'The squad gains the {rr} special rule.')
              x=local_upgrade(tg,'Marksmen','veteran-tactic-marksmen',0,1); rule(x,'Marksmen','veteran-tactic-marksmen-rule','Normal Bolters fired by models in the squad have Twin-linked. This does not apply to Combi-weapons, Foeblaster Boltguns or other bolt weapon variants.')

              mg=group(u,'Close Combat Weapon Replacements','veteran-melee',maxv=5)
              mod_repeat(mg,'veteran-melee-max',1,'veteran-additional')
              for nm,sid,target,pts in [('Chainaxe','veteran-melee-chainaxe','gear-chainaxe',4),('Rending Weapon','veteran-melee-rending','gear-rending',5),('Power Weapon','veteran-melee-power','gear-power-weapon',10)]: qty_link(mg,nm+' (replaces Chainsword)',sid,target,pts,base_max=10)

              rg=group(u,'Bolter Replacements','veteran-ranged',maxv=5)
              mod_repeat(rg,'veteran-ranged-max',1,'veteran-additional')
              for nm,sid,target,pts in [('Foeblaster Boltgun','veteran-ranged-foe','gear-foeblaster',2),('Combi-Flamer','veteran-ranged-cf','gear-combi-flamer',5),('Combi-Volkite Charger','veteran-ranged-cv','gear-combi-volkite',5),('Combi-Meltagun','veteran-ranged-cm','gear-combi-melta',10),('Combi-Plasma Gun','veteran-ranged-cp','gear-combi-plasma',10)]: qty_link(rg,nm+' (replaces Bolter)',sid,target,pts,base_max=10)

              ag=group(u,'Individual Wargear','veteran-individual')
              cs=link(ag,'Combat Shield (per model)','veteran-shields','gear-combat-shield',5,5); mod_repeat(cs,'veteran-shields-max',1,'veteran-additional')
              mb=link(ag,'Melta Bombs (per model)','veteran-bombs','gear-melta-bombs',5,5); mod_repeat(mb,'veteran-bombs-max',1,'veteran-additional')
              kg=link(ag,'Krak Grenades (+2 pts/model)','veteran-krak','gear-krak',10,1); mod_repeat(kg,'pts',2,'veteran-additional')

              sg=group(u,'Specialist Weapons (1 per 5 models)','veteran-specialists',maxv=1)
              mod_set(sg,'veteran-specialists-max',2,'veteran-additional','atLeast',5)
              specs=[('Rotor Cannon','veteran-sp-rotor','gear-rotor',4),('Flamer','veteran-sp-flamer','gear-flamer',5),('Meltagun','veteran-sp-melta','gear-meltagun',10),('Plasma Gun','veteran-sp-plasma','gear-plasma-gun',15),('Volkite Charger','veteran-sp-vc','gear-volkite-charger',10),('Volkite Caliver','veteran-sp-vcal','gear-volkite-caliver',15),('Heavy Flamer with Suspensor Web','veteran-sp-hf','gear-heavy-flamer-susp',10),('Heavy Bolter with Suspensor Web','veteran-sp-hb','gear-heavy-bolter-susp',15),('Missile Launcher with Suspensor Web','veteran-sp-ml','gear-missile-susp',20)]
              for nm,sid,target,pts in specs: qty_link(sg,nm+' (replaces Bolter)',sid,target,pts,base_max=2)
              # Specialist Bolter replacements reduce remaining ordinary Bolter replacement capacity.
              for _,sid,_,_ in specs: mod_repeat(rg,'veteran-ranged-max',-1,sid,include=True)

              eq=group(u,'Squad Equipment','veteran-equipment')
              link(eq,'Legion Vexilla','veteran-vexilla','gear-vexilla',10,1)
              link(eq,'Nuncio Vox','veteran-nuncio','gear-nuncio',10,1)

              jp=local_upgrade(ag,'Jump Packs (+15 pts/model)','veteran-jump-packs',75,1); mod_repeat(jp,'pts',15,'veteran-additional')
              rule(jp,'Jump Packs','veteran-jump-rule','The entire squad becomes Jump Infantry. The squad may not select a Dedicated Transport. This option is only available if the squad has not selected a Heavy weapon.')
              for heavyid in ['veteran-sp-hf','veteran-sp-hb','veteran-sp-ml']:
                  mod_set(jp,'hidden','true',heavyid,'atLeast',1)
                  mod_set(jp,'veteran-jump-packs-max',0,heavyid,'atLeast',1)

              ar=armory_points_group(u,'Legion Veteran Sergeant — Additional Armoury (max 50 pts)','veteran-sgt-armoury')
              # Only non-duplicated Sergeant options are shown here.
              for nm,sid,target,pts in [('Hand Flamer','veteran-sgt-hf','gear-hand-flamer',5),('Lightning Claw','veteran-sgt-lc','gear-lightning-claw',25),('Pair of Lightning Claws','veteran-sgt-pair','gear-pair-lightning-claws',30),('Plasma Pistol','veteran-sgt-pp','gear-plasma-pistol',15),('Power Fist','veteran-sgt-pf','gear-power-fist',25),('Thunder Hammer','veteran-sgt-th','gear-thunder',30),('Volkite Serpenta','veteran-sgt-vs','gear-volkite-serpenta',5),('Combi-Bolter','veteran-sgt-cb','gear-combi-bolter',5),('Combi-Grenade Launcher','veteran-sgt-cg','gear-combi-grenade',10),('Storm Bolter','veteran-sgt-sb','gear-storm-bolter',5),('Auspex','veteran-sgt-auspex','gear-auspex',2),('Bionics','veteran-sgt-bionics','gear-bionics',10),('Purity Seals','veteran-sgt-purity','gear-purity',5),('Teleport Homer','veteran-sgt-homer','gear-homer',5)]:
                  link(ar,nm,sid,target,pts,1)
              rule(ar,'Sergeant Armoury Restrictions','veteran-sgt-arm-rule','The Sergeant may select up to 50 points of permitted Space Marine Armoury equipment. Unit-specific options and equipment already carried are not repeated here. No item may be selected more than once unless specifically permitted. A Pair of Lightning Claws counts as two weapon choices.')

              tr=group(u,'Dedicated Transport','veteran-transport',maxv=1)
              constraint(tr,'veteran-transport-max','max',1,include=True)
              for nm,sid,target in [('Rhino','veteran-tr-rhino','transport-rhino'),('Drop Pod','veteran-tr-pod','transport-drop-pod'),('Dreadclaw Drop Pod','veteran-tr-dc','transport-dreadclaw')]: link(tr,nm,sid,target,0,1)
              mod_set(tr,'hidden','true','veteran-jump-packs','atLeast',1)
              mod_set(tr,'veteran-transport-max',0,'veteran-jump-packs','atLeast',1)
              rule(u,'Dedicated Transport','veteran-transport-rule','If not equipped with Jump Packs, the squad may select a Rhino, Drop Pod, Dreadclaw Drop Pod or Land Raider where permitted. Land Raider choices will become selectable when their vehicle entries are added; the rule remains in force now.')
              existing.add('veteran-unit')

          # ---------- LEGION TERMINATOR SQUAD ----------
          if 'terminator-unit' not in existing:
              u=selection(top,'unit','Legion Terminator Squad','terminator-unit'); cat_elite(u,'terminator-unit')
              rule(u,'Standard Wargear','terminator-standard','Every model is equipped with the selected Terminator Armour pattern, a Combi-bolter and a Power Weapon unless replaced below.')
              rule(u,'Legiones Astartes','terminator-legiones','All models have the Legiones Astartes special rule and And They Shall Know No Fear as presented in ProHammer Classic. They are not Fearless.')
