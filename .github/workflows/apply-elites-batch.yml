              for nm,sid,target,pts in [('Heavy Flamer','terminator-h-hf','gear-heavy-flamer',10),('Reaper Autocannon','terminator-h-ra','gear-reaper-autocannon',15),('Plasma Blaster','terminator-h-pb','gear-plasma-blaster',15),('Assault Cannon','terminator-h-ac','gear-assault-cannon',20)]:
