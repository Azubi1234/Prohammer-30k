              jp=local_upgrade(sw,'Jump Packs (+15 pts/model)','destroyer-jump-packs',75,1); mod_repeat(jp,'pts',15,'destroyer-additional'); rule(jp,'Jump Packs','destroyer-jump-rule','Every model gains a Jump Pack and the unit becomes Jump Infantry. A Destroyer Squad equipped with Jump Packs may not select a Dedicated Transport.')

              wg=group(u,'Destroyer Weapons (1 per 5 models)','destroyer-weapons',maxv=1); mod_set(wg,'destroyer-weapons-max',2,'destroyer-additional','atLeast',5)
              for nm,sid,target,pts in [('Volkite Serpenta','destroyer-w-vs','gear-volkite-serpenta',5),('Hand Flamer','destroyer-w-hf','gear-hand-flamer',10),('Plasma Pistol','destroyer-w-pp','gear-plasma-pistol',15),('Missile Launcher with Suspensor Web and Rad Missiles','destroyer-w-rad','gear-rad-missile',25)]: qty_link(wg,nm+' (replaces one Bolt Pistol)',sid,target,pts,base_max=2)

              sg=group(u,'Legion Destroyer Sergeant','destroyer-sgt')
              cm=group(sg,'Chainsword Replacement','destroyer-sgt-melee',maxv=1)
              for nm,sid,target,pts in [('Rending Weapon','destroyer-sgt-rw','gear-rending',5),('Power Weapon','destroyer-sgt-pw','gear-power-weapon',10),('Power Fist','destroyer-sgt-pf','gear-power-fist',15),('Lightning Claw','destroyer-sgt-lc','gear-lightning-claw',15),('Thunder Hammer','destroyer-sgt-th','gear-thunder',20)]: link(cm,nm,sid,target,pts,1)
              link(sg,'Phosphex Bomb','destroyer-sgt-phosphex','gear-phosphex-bomb',10,3)
              ar=armory_points_group(sg,'Additional permitted Sergeant Armoury (max 50 pts)','destroyer-sgt-armoury')
              for nm,sid,target,pts in [('Volkite Serpenta','destroyer-sgt-vs','gear-volkite-serpenta',5),('Hand Flamer','destroyer-sgt-hf','gear-hand-flamer',5),('Plasma Pistol','destroyer-sgt-pp','gear-plasma-pistol',15),('Pair of Lightning Claws','destroyer-sgt-pair','gear-pair-lightning-claws',30),('Combi-Bolter','destroyer-sgt-cb','gear-combi-bolter',5),('Combi-Flamer','destroyer-sgt-cf','gear-combi-flamer',10),('Combi-Grenade Launcher','destroyer-sgt-cg','gear-combi-grenade',10),('Combi-Meltagun','destroyer-sgt-cm','gear-combi-melta',15),('Combi-Plasma Gun','destroyer-sgt-cp','gear-combi-plasma',15),('Combi-Volkite Charger','destroyer-sgt-cv','gear-combi-volkite',10),('Storm Bolter','destroyer-sgt-sb','gear-storm-bolter',5),('Combat Shield','destroyer-sgt-cshield','gear-combat-shield',5),('Auspex','destroyer-sgt-auspex','gear-auspex',2),('Bionics','destroyer-sgt-bionics','gear-bionics',10),('Purity Seals','destroyer-sgt-purity','gear-purity',5),('Teleport Homer','destroyer-sgt-homer','gear-homer',5)]: link(ar,nm,sid,target,pts,1)
              ib=link(ar,'Melta Bombs','destroyer-sgt-melta','gear-melta-bombs',5,1); mod_set(ib,'hidden','true','destroyer-squad-melta','atLeast',1); mod_set(ib,'destroyer-sgt-melta-max',0,'destroyer-squad-melta','atLeast',1)
              rule(ar,'Sergeant Armoury Restrictions','destroyer-sgt-arm-rule','Unit-specific Chainsword replacements and standard equipment are not duplicated here. No item may be selected more than once unless specifically permitted. A Pair of Lightning Claws counts as two weapon choices. Artificer Armour is not present in the current Destroyer Sergeant entry and is therefore not offered.')

