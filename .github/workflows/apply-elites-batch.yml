              a=local_upgrade(ap,'Cataphractii Terminator Armour','terminator-armour-cataphractii',0,1); rule(a,'Cataphractii Terminator Armour','terminator-armour-cataphractii-rule','2+ Armour Save, 4+ Invulnerable Save; Relentless, Bulky, Deep Strike; may not Advance, Pursue or fire Overwatch. Models in any form of Terminator Armour may not embark upon Rhinos or Drop Pods.')

              rg=group(u,'Ranged Weapon Replacements','terminator-ranged',maxv=5); mod_repeat(rg,'terminator-ranged-max',1,'terminator-additional')
              for nm,sid,target,pts in [('Storm Bolter','terminator-r-sb','gear-storm-bolter',0),('Foeblaster Boltgun','terminator-r-foe','gear-foeblaster',5),('Combi-Flamer','terminator-r-cf','gear-combi-flamer',10),('Combi-Meltagun','terminator-r-cm','gear-combi-melta',15),('Combi-Plasma Gun','terminator-r-cp','gear-combi-plasma',15),('Combi-Volkite Charger','terminator-r-cv','gear-combi-volkite',10),('Volkite Charger','terminator-r-vc','gear-volkite-charger',10)]: qty_link(rg,nm+' (replaces Combi-bolter)',sid,target,pts,base_max=10)

              cg=group(u,'Close Combat Weapon Replacements','terminator-melee',maxv=5); mod_repeat(cg,'terminator-melee-max',1,'terminator-additional')
              for nm,sid,target,pts in [('Power Fist','terminator-m-pf','gear-power-fist',5),('Lightning Claw','terminator-m-lc','gear-lightning-claw',5),('Chainfist','terminator-m-cf','gear-chainfist',10),('Thunder Hammer','terminator-m-th','gear-thunder',10)]: qty_link(cg,nm+' (replaces Power Weapon)',sid,target,pts,base_max=10)

