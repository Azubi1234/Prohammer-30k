name: Revision 75 Crohne Source Entry diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/r75_diag_crohne_source_entry.py'
      - '.github/workflows/r75-crohne-source-entry-diag.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Diagnose Crohne source rendering
        run: python .github/build/r75_diag_crohne_source_entry.py
      - name: Commit diagnostic
        run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add inspection-r75-crohne-source-entry.txt
          git diff --cached --quiet || git commit -m 'Add Revision 75 Crohne Source Entry diagnostic'
          git pull --rebase origin main
          for i in 1 2 3 4; do git push && break || { sleep 2; git pull --rebase origin main; }; done
