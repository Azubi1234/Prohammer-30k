name: Diagnose Revision 52 Emperor's Children
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/rev52_ec_diagnostic.py'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Emperor's Children structures
        run: python .github/build/rev52_ec_diagnostic.py
      - name: Publish diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r52-ec-diagnostic.txt
          git diff --cached --quiet || git commit -m "Revision 52: inspect Emperor's Children structures"
          git push
