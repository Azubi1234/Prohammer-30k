name: Retry Legiones Astartes Elites batch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run corrected Elites builder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/apply-elites-batch.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          body = wf.split(marker,1)[1].split("\n          PY",1)[0]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(lines)
          # group() already creates these max constraints; the first workflow duplicated them.
          for bad in [
              "              constraint(tr,'veteran-transport-max','max',1,include=True)\n",
              "              constraint(tr,'terminator-transport-max','max',1,include=True)\n",
              "              constraint(tr,'destroyer-transport-max','max',1,include=True)\n",
          ]:
              script=script.replace(bad,'')
          exec(compile(script,'elites_builder.py','exec'),{})
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Legiones Astartes.cat" "Prohammer 30k.gst"
          git commit -m "Add core Legiones Astartes Elites [skip ci]"
          git push
