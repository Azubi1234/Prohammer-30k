name: Diagnose Revision 66 Imperial Fists Warlord
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/diag_r66_if_warlord.py'
      - '.github/workflows/diag-r66-if-warlord.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r66_if_warlord.py
