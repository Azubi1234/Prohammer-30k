name: Inspect revision 25 catalogue context
on:
  push:
    paths:
      - '.github/workflows/inspect-rev25-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect catalogue and game system
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for fn in ['Legiones Astartes.cat','Prohammer 30k.gst']:
              r=ET.parse(fn).getroot(); ns=r.tag.split('}')[0]+'}'; q=lambda t:ns+t
              print('\nFILE',fn,'ROOT',r.tag,'ATTRS',r.attrib)
              print('CATEGORIES')
              ce=r.find(q('categoryEntries'))
              if ce is not None:
                  for x in ce: print(x.get('id'),x.get('name'),x.get('primary'))
              print('PROFILE TYPES')
              pt=r.find(q('profileTypes'))
              if pt is not None:
                  for x in pt:
                      chars=x.find(q('characteristicTypes'))
                      print(x.get('id'),x.get('name'),[(c.get('id'),c.get('name')) for c in (chars or [])])
              if fn.endswith('.cat'):
                  print('TOP LEVEL UNITS/CONFIG')
                  se=r.find(q('selectionEntries'))
                  if se is not None:
                      for x in se:
                          cats=x.find(q('categoryLinks'))
                          cl=[(c.get('targetId'),c.get('name')) for c in (cats or [])]
                          print(x.get('id'),x.get('name'),x.get('type'),cl)
                  print('ROOT GROUPS')
                  sg=r.find(q('selectionEntryGroups'))
                  if sg is not None:
                      for g in sg:
                          print('GROUP',g.get('id'),g.get('name'))
                          es=g.find(q('selectionEntries'))
                          if es is not None:
                              for x in list(es)[:30]: print('  ',x.get('id'),x.get('name'),x.get('type'))
          PY
