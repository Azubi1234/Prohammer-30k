name: Diagnose R83 Scions candidates
on:
  workflow_dispatch:
  push:
    paths: ['.github/build/r83_diag_scions_candidates.py','.github/workflows/diag-r83-scions-candidates.yml']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/r83_diag_scions_candidates.py
      - run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add inspection-r83-scions-candidates.txt
          git diff --cached --quiet || git commit -m 'R83 diagnostic: Scions transport candidates'
          git pull --rebase origin main
          git push
