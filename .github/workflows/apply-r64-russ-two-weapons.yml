name: Apply Revision 64 Leman Russ weapon choice

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/r64_russ_two_weapons.py'
      - '.github/workflows/apply-r64-russ-two-weapons.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Leman Russ two-weapon choice
        run: python .github/build/r64_russ_two_weapons.py
      - name: Run permanent unit-size audit
        run: python .github/build/r56_audit_all_unit_sizes.py
      - name: Verify Revision 64
        run: |
          grep -q 'dataRevision="64"' index.xml
          grep -q 'The Wolf King’s Weapons — select two' 'Legiones Astartes.cat'
          grep -q 'Revision 64 follow-up:' inspection-r63-space-wolves-full.txt
      - name: Commit Revision 64
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Legiones Astartes.cat' index.xml inspection-r63-space-wolves-full.txt inspection-r56-all-unit-sizes.txt .github/build/rev63_space_wolves_full.py .github/workflows/apply-r63-space-wolves-full.yml
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Revision 64: make Leman Russ select two weapons'
            git push
          fi
