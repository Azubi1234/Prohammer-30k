name: Inspect revision 25 parser
on:
  push:
    paths:
      - '.github/workflows/inspect-rev25-parser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download authoritative Markdown sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          curl -L -sS 'https://docs.google.com/document/d/1Rem0x-V74HRqpCBlqDGD5x4sTUQ0lEw-WB9xvqOUkIA/export?format=md' -o 'sources/Legiones Astartes Army List.md'
          curl -L -sS 'https://docs.google.com/document/d/15yOQ5xqfa7QAJ15GlHqN7F4HvO_jk6K1w5fQ2xkGngk/export?format=md' -o 'sources/Forces of the Legions.md'
          curl -L -sS 'https://docs.google.com/document/d/1ZDtRchn_AtKUGT922-EyoyXfZDajVwAdl-QeyhZG-S4/export?format=md' -o 'sources/Lords of War.md'
          curl -L -sS 'https://docs.google.com/document/d/1wkGCuVmsIeBmhRyZR0X9ftQUSqG3RDwlSY774Zt749Y/export?format=md' -o 'sources/Areonautica Imperialis.md'
      - name: Run staged parser only
        shell: bash
        run: |
          set -euo pipefail
          sed '/^CAT=Path(/,$d' .github/build/rev25_partial.py > /tmp/parser.py
          cat >> /tmp/parser.py <<'PY'
          print('LEGION_COUNT',len(LEGIONS))
          print('LEGION_SUMMARY')
          for l in LEGIONS:
              print(l['roman'],l['name'],'entries=',len(l['entries']),'rites=',len(l['rites']),'consuls=',len(l['consuls']))
              print('  ENTRIES:', ' | '.join(f"{e['foc']}:{e['title']}:{e['cost']}" for e in l['entries']))
              if l['rites']: print('  RITES:', ' | '.join(r['title'] for r in l['rites']))
              if l['consuls']: print('  CONSULS:', ' | '.join(f"{c['title']}:{c['cost']}" for c in l['consuls']))
          print('LOW_COUNT',len(LOW))
          for e in LOW: print('LOW',e['foc'],e['title'],e['cost'],'base',e['base_count'],'extra',e['extra'])
          print('AERO_COUNT',len(AERO))
          for e in AERO: print('AERO',e['foc'],e['title'],e['cost'],'base',e['base_count'],'extra',e['extra'])
          PY
          python /tmp/parser.py
      - name: Inspect configuration internals
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse('Legiones Astartes.cat').getroot(); ns=r.tag.split('}')[0]+'}'; q=lambda t:ns+t
          def byid(i): return next((e for e in r.iter() if e.get('id')==i),None)
          for eid in ['config-army','hq-centurion','hq-praetor']:
              e=byid(eid)
              print('\nNODE',eid, e.get('name') if e is not None else None)
              if e is None: continue
              for x in e.iter():
                  if x is e: continue
                  ident=x.get('id'); name=x.get('name'); typ=x.get('type')
                  if ident or name:
                      print(' ',x.tag.split('}')[-1],ident,name,typ,'target',x.get('targetId'))
          PY
