name: Diagnose Revision 70 Imperial Fists standards audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/r70_diag_imperial_fists_standards.py'
      - '.github/workflows/diag-r70-imperial-fists-standards.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Diagnose current catalogue
        run: python .github/build/r70_diag_imperial_fists_standards.py
      - name: Commit diagnostic
        run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add inspection-r70-if-standards-diagnostic-compact.txt
          git diff --cached --quiet || git commit -m 'Revision 70 diagnostic: audit Imperial Fists standards gaps'
          git push
