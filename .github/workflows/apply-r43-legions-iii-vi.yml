name: Apply Revision 43 Legions III-VI builder completion
on:
  push:
    paths:
      - '.github/workflows/apply-r43-legions-iii-vi.yml'
      - '.github/build/rev43_legions_iii_vi.py'
      - '.github/build/rev43_prune_role_clone_links.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Legions III-VI builder interactions
        shell: bash
        run: |
          set -euo pipefail
          python .github/build/rev43_legions_iii_vi.py
          python .github/build/rev43_prune_role_clone_links.py
          git diff --check
      - name: Validate New Recruit catalogue and game system
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          CAT='Legiones Astartes.cat'; GST='Prohammer 30k.gst'
          cr=ET.parse(CAT).getroot(); gr=ET.parse(GST).getroot()
          assert cr.get('revision')=='43',cr.get('revision')
          assert cr.get('gameSystemRevision')==gr.get('revision'),(cr.get('gameSystemRevision'),gr.get('revision'))
          for root,label in [(cr,'CAT'),(gr,'GST')]:
              ids=[e.get('id') for e in root.iter() if e.get('id')]
              dup=[x for x,n in Counter(ids).items() if n>1]
              assert not dup,(label,dup[:30])
          ids={e.get('id') for e in cr.iter() if e.get('id')}|{e.get('id') for e in gr.iter() if e.get('id')}
          broken=[]
          for e in cr.iter():
              if e.get('id','').startswith('r43-'):
                  for a in ('targetId','childId'):
                      v=e.get(a)
                      if v and v not in ids:broken.append((e.get('id'),a,v))
          assert not broken,broken[:30]
          required=['r43-ec-phoenix-spear','r43-ec-sonic-package','r43-iw-shrapnel-bolts','r43-ws-bike-troops','r43-ws-sagyar-ebon-troops','r43-sw-frost-weapon','r43-sw-runic-armour']
          for ident in required:assert any(e.get('id')==ident for e in cr.iter()),ident
          for ident in ['r43-iw-fast-max','r43-iw-heavy-max','r43-ws-chogorian-heavy-max','r43-sw-hq-max','r43-sw-pale-heavy-max','r43-ec-maru-heavy-max']:
              assert any(e.get('id')==ident for e in gr.iter()),ident
          for ident in ['da22-lion','da22-corswain','da22-rite-storm','r40-da-storm-tactical','r40-da-forward-deployment']:
              assert any(e.get('id')==ident for e in cr.iter()),ident
          print('VALIDATION OK — Revision',cr.get('revision'),'GST',gr.get('revision'))
          PY
      - name: Publish Revision 43
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst'
          git commit -m 'Revision 43: finish New Recruit interactions for Legions III-VI' || exit 0
          git pull --rebase origin main
          git push
