name: Inspect generic rites structure
on:
  push:
    paths: ['.github/workflows/inspect-generic-rites.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write exact option report
        run: |
          python - <<'PY' > inspection-generic-rites.txt
          import xml.etree.ElementTree as ET
          NS='http://www.battlescribe.net/schema/catalogueSchema'; C=lambda t:f'{{{NS}}}{t}'
          r=ET.parse('Legiones Astartes.cat').getroot()
          def byid(i): return next((e for e in r.iter() if e.get('id')==i),None)
          ids=['veteran-jump-packs','veteran-transport','destroyer-unit','dreadnought-unit','contemptor-unit','hq-praetor','hq-centurion','rite-assault-company','rite-recon-company','rite-sky-hunter']
          print('CAT',r.get('revision'),'GST',r.get('gameSystemRevision'))
          for i in ids:
              e=byid(i); print('\n###',i); print(ET.tostring(e,encoding='unicode')[:40000] if e is not None else 'MISSING')
          PY
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-generic-rites.txt
          git commit -m 'Refresh temporary generic rites report' || exit 0
          git push
