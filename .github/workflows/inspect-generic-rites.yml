name: Inspect generic rites structure
on:
  push:
    paths: ['.github/workflows/inspect-generic-rites.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect affected option structures
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          NS='http://www.battlescribe.net/schema/catalogueSchema'; C=lambda t:f'{{{NS}}}{t}'
          r=ET.parse('Legiones Astartes.cat').getroot()
          def byid(i): return next((e for e in r.iter() if e.get('id')==i),None)
          def sub(e, tag):
              q=e.find(C(tag)); return ET.tostring(q,encoding='unicode') if q is not None else ''
          for i in ['veteran-unit','tactical-unit','assault-unit','breacher-unit','recon-unit','destroyer-unit','dreadnought-unit','contemptor-unit','fa-sky-hunter','hs-predator','hq-praetor','hq-centurion']:
              e=byid(i)
              print('\n###',i,e.get('name') if e is not None else 'MISSING')
              if e is None: continue
              for tag in ['selectionEntries','selectionEntryGroups','entryLinks']:
                  s=sub(e,tag)
                  if s: print(tag,s[:30000])
          print('\n### TRANSPORT TARGETS / NAMES')
          for e in r.iter(C('selectionEntry')):
              n=(e.get('name') or '').lower()
              if any(k in n for k in ['drop pod','dreadclaw','land raider phobos','land raider proteus','space marine bike','jetbike','terminator armour','cataphractii']):
                  print(e.get('id'),'|',e.get('name'),'|',e.get('type'))
          print('\n### ENTRYLINKS TO TRANSPORTS')
          for e in r.iter(C('entryLink')):
              n=(e.get('name') or '').lower()
              if any(k in n for k in ['drop pod','dreadclaw','land raider']):
                  print(ET.tostring(e,encoding='unicode')[:4000])
          PY
