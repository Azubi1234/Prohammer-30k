name: Inspect generic rites structure
on:
  push:
    paths:
      - '.github/workflows/inspect-generic-rites.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Rite selector and category machinery
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          NS='http://www.battlescribe.net/schema/catalogueSchema'
          C=lambda t:f'{{{NS}}}{t}'
          r=ET.parse('Legiones Astartes.cat').getroot()
          pm={c:p for p in r.iter() for c in p}
          def lname(e): return e.tag.split('}')[-1]
          def path(e):
              out=[]
              while e is not None and e is not r:
                  out.append(f"{lname(e)}:{e.get('name') or e.get('id') or ''}")
                  e=pm.get(e)
              return ' > '.join(reversed(out))
          def byid(i):
              return next((e for e in r.iter() if e.get('id')==i),None)
          print('CAT',r.get('revision'),'GST',r.get('gameSystemRevision'))
          for i in ['config-army','config-rites','da22-rite-primarchs-chosen','da22-rite-storm']:
              e=byid(i)
              print('\n###',i,path(e) if e is not None else 'MISSING')
              if e is not None: print(ET.tostring(e,encoding='unicode')[:25000])
          print('\n### CATEGORY LINKS WITH MODIFIERS')
          found=0
          for e in r.iter(C('categoryLink')):
              if e.find(C('modifiers')) is not None:
                  print(path(e))
                  print(ET.tostring(e,encoding='unicode')[:8000])
                  found+=1
          print('TOTAL',found)
          print('\n### UNIT ROOT MODIFIERS / CONDITIONS')
          for i in ['veteran-unit','terminator-unit','destroyer-unit','dreadnought-unit','contemptor-unit','fa-sky-hunter','hs-predator','assault-unit','breacher-unit','recon-unit','tactical-unit']:
              e=byid(i); print('\n',i)
              if e is None: continue
              for tag in ['constraints','modifiers','categoryLinks']:
                  q=e.find(C(tag))
                  if q is not None: print(tag,ET.tostring(q,encoding='unicode')[:12000])
          PY
