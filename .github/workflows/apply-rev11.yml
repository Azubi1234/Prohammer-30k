name: Apply rev11 Assault Squad
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write revision 11 catalogue
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib
          data = ''''''
          pathlib.Path('Legiones Astartes.cat').write_bytes(zlib.decompress(base64.b64decode(data)))
          PY
      - name: Commit catalogue
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Legiones Astartes.cat"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Legion Assault Squad [skip ci]"
          git push
