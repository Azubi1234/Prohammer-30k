name: Apply Revision 50 full New Recruit source refresh
on:
  push:
    paths:
      - '.github/workflows/apply-r50-force-source-refresh.yml'
      - '.github/build/rev50_force_source_refresh.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply full source revision bump
        shell: bash
        run: |
          set -euo pipefail
          python .github/build/rev50_force_source_refresh.py
          git diff --check
      - name: Publish Revision 50
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' inspection-r50-source-refresh.txt
          git commit -m "Revision 50: force full New Recruit source refresh"
          git push
