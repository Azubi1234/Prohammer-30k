name: Diagnose Revision 64 Imperial Fists
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/diag_r64_imperial_fists.py'
      - '.github/workflows/diag-r64-imperial-fists.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r64_imperial_fists.py
