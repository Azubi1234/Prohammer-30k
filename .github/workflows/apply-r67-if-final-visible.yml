name: Apply Revision 67 Imperial Fists final visible pass
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/rev67_if_final_visible.py'
      - '.github/workflows/apply-r67-if-final-visible.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply final Imperial Fists visible pass
        run: python .github/build/rev67_if_final_visible.py
      - name: Run permanent unit-size audit
        run: python .github/build/r56_audit_all_unit_sizes.py
      - name: Verify Revision 67
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          g=ET.parse('Prohammer 30k.gst').getroot()
          assert c.get('revision')=='67', c.get('revision')
          assert c.get('gameSystemRevision')=='35', c.get('gameSystemRevision')
          assert g.get('revision')=='35', g.get('revision')
          print('Revision 67/35 verified')
          PY
      - name: Commit generated data
        run: |
          git config user.name "Azubi1234"
          git config user.email "132048044+Azubi1234@users.noreply.github.com"
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-r67-imperial-fists-final.txt
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'Revision 67: finalise visible Imperial Fists implementation'
            git push
          fi
