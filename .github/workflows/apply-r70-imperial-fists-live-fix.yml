name: Apply Revision 70 Imperial Fists live standards fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/rev70_imperial_fists_live_fix.py'
      - '.github/workflows/apply-r70-imperial-fists-live-fix.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Preflight and repair Revision 70 builder
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=ET.parse('Legiones Astartes.cat').getroot()
          ids={e.get('id') for e in root.iter() if e.get('id')}
          p=Path('.github/build/rev70_imperial_fists_live_fix.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("for n,u in enumerate(list(cr.iter(C('selectionEntry'))):", "for n,u in enumerate(list(cr.iter(C('selectionEntry')))):")
          if 'gear-grenade-harness' not in ids:
              old="if kind=='huscarl': link(war,uid+'-gh','Grenade Harness','gear-grenade-harness')"
              new="if kind=='huscarl': local(war,uid+'-gh','Grenade Harness',10,'Terminator Armour only.')"
              if old in s: s=s.replace(old,new)
          old="def new_templar_transport(u,idx):\n    for g in direct_groups(u):\n        if (g.get('name') or '')=='Templar Assault — Assault Transport': remove_node(cr,g)\n    g=group(u,f'r70-if-templar-transport-{idx}','Templar Assault — Assault Transport',maxsel=1)"
          new="def new_templar_transport(u,idx):\n    for g in direct_groups(u):\n        gname=(g.get('name') or '')\n        if gname=='Templar Assault — Assault Transport':\n            remove_node(cr,g)\n        elif gname=='Dedicated Transport':\n            add_hide_if(g,f'r70-if-templar-normal-dt-hide-{idx}',TEMPLAR)\n    g=group(u,f'r70-if-templar-transport-{idx}','Templar Assault — Assault Transport',maxsel=1)"
          if old in s: s=s.replace(old,new)
          old="ET.indent(ct,space='  '); ET.indent(gt,space='  '); ET.indent(it,space='  ')\nct.write(CAT,encoding='utf-8',xml_declaration=True); gt.write(GST,encoding='utf-8',xml_declaration=True); it.write(IDX,encoding='utf-8',xml_declaration=True)"
          new="ET.indent(ct,space='  '); ET.indent(gt,space='  '); ET.indent(it,space='  ')\nET.register_namespace('',CNS); ct.write(CAT,encoding='utf-8',xml_declaration=True)\nET.register_namespace('',GNS); gt.write(GST,encoding='utf-8',xml_declaration=True)\nET.register_namespace('',INS); it.write(IDX,encoding='utf-8',xml_declaration=True)"
          if old not in s: raise SystemExit('Expected XML write block not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          compile(s,str(p),'exec')
          PY
      - name: Apply Revision 70
        run: python .github/build/rev70_imperial_fists_live_fix.py
      - name: Run permanent unit-size audit
        run: python .github/build/r56_audit_all_unit_sizes.py
      - name: Verify Revision 70
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot(); g=ET.parse('Prohammer 30k.gst').getroot()
          assert c.get('revision')=='70' and c.get('gameSystemRevision')=='38'
          assert g.get('revision')=='38'
          cat=open('Legiones Astartes.cat',encoding='utf-8').read(); gst=open('Prohammer 30k.gst',encoding='utf-8').read()
          assert '<ns0:' not in cat and '<ns0:' not in gst
          print(open('inspection-r70-imperial-fists-live.txt',encoding='utf-8').read())
          PY
      - name: Commit generated live data
        run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add '.github/build/rev70_imperial_fists_live_fix.py' 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-r70-imperial-fists-live.txt inspection-r56-all-unit-sizes.txt
          git diff --cached --quiet || git commit -m 'Revision 70: complete Imperial Fists live implementation'
          git push
