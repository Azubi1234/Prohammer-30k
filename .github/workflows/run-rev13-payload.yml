name: Run rev13 Breacher payload
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute rev13 payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          payload = Path('.github/workflows/apply-rev13.yml').read_text(encoding='utf-8')
          start_token = "          python3 - <<'PY'\n"
          end_token = "\n          PY\n"
          start = payload.index(start_token) + len(start_token)
          end = payload.index(end_token, start)
          code = textwrap.dedent(payload[start:end])
          exec(compile(code, 'rev13_payload.py', 'exec'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Legiones Astartes.cat"
          git commit -m "Add Legion Breacher Siege Squad revision 13"
          git push
