name: Diagnose Revision 81 Iron Hands compact
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/r81_diag_ih_compact.py'
      - '.github/workflows/diag-r81-ih-compact.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/r81_diag_ih_compact.py
      - run: |
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add inspection-r81-ih-compact.txt
          git diff --cached --quiet || git commit -m 'Revision 81 diagnostic: compact Iron Hands live structure'
          git pull --rebase origin main
          git push
