name: Fix duplicated Elite transport options
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean transport groups and validate catalogue
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from collections import Counter

          CAT=Path('Legiones Astartes.cat')
          GST=Path('Prohammer 30k.gst')
          NS='http://www.battlescribe.net/schema/catalogueSchema'
          ET.register_namespace('',NS)
          q=lambda t:f'{{{NS}}}{t}'

          tree=ET.parse(CAT); root=tree.getroot()
          if root.attrib.get('revision')!='16' or root.attrib.get('gameSystemRevision')!='6':
              raise SystemExit('Expected catalogue revision 16 / game system revision 6')

          def by_id(node, tag, sid):
              for e in node.iter(q(tag)):
                  if e.attrib.get('id')==sid: return e
              raise SystemExit(f'Missing {tag} {sid}')

          def ensure_container(parent, tag):
              x=parent.find(q(tag))
              if x is None: x=ET.SubElement(parent,q(tag))
              return x

          def constraint(parent, cid, typ='max', value='1', field='selections', scope='parent', include='true'):
              cs=ensure_container(parent,'constraints')
              ET.SubElement(cs,q('constraint'),{'id':cid,'type':typ,'value':value,'field':field,'scope':scope,'shared':'true','includeChildSelections':include})

          def entrylink(parent,name,eid,target):
              el=ensure_container(parent,'entryLinks')
              e=ET.SubElement(el,q('entryLink'),{'import':'true','name':name,'hidden':'false','id':eid,'type':'selectionEntry','targetId':target})
              constraint(e,eid+'-max',include='false')
              return e

          def add_hide_when_selected(group,constraint_id,child_id):
              mods=ensure_container(group,'modifiers')
              for field,value in [('hidden','true'),(constraint_id,'0')]:
                  m=ET.SubElement(mods,q('modifier'),{'type':'set','value':value,'field':field})
                  cs=ET.SubElement(m,q('conditions'))
                  ET.SubElement(cs,q('condition'),{'type':'atLeast','value':'1','field':'selections','scope':'root-entry','childId':child_id,'shared':'true','includeChildSelections':'true'})

          # Veteran: keep only its own three transport links and veteran jump-pack gating.
          vg=by_id(root,'selectionEntryGroup','veteran-transport')
          els=vg.find(q('entryLinks'))
          remove_ids={'terminator-tr-dc','destroyer-tr-rhino','destroyer-tr-pod','destroyer-tr-dc'}
          for ch in list(els):
              if ch.attrib.get('id') in remove_ids: els.remove(ch)
          mods=vg.find(q('modifiers'))
          if mods is not None:
              for m in list(mods):
                  xml=ET.tostring(m,encoding='unicode')
                  if 'destroyer-jump-packs' in xml or 'destroyer-transport-max' in xml:
                      mods.remove(m)

          # Terminators: a five-model squad may take one Dreadclaw; larger squads may not.
          term=by_id(root,'selectionEntry','terminator-unit')
          tgroups=ensure_container(term,'selectionEntryGroups')
          if any(g.attrib.get('id')=='terminator-transport' for g in tgroups.findall(q('selectionEntryGroup'))):
              raise SystemExit('Terminator transport group already exists')
          tg=ET.SubElement(tgroups,q('selectionEntryGroup'),{'name':'Dedicated Transport','id':'terminator-transport','hidden':'false'})
          constraint(tg,'terminator-transport-max')
          entrylink(tg,'Dreadclaw Drop Pod','terminator-tr-dc','transport-dreadclaw')
          add_hide_when_selected(tg,'terminator-transport-max','terminator-additional')

          # Destroyers: their own transport selector, disabled when Jump Packs are selected.
          destr=by_id(root,'selectionEntry','destroyer-unit')
          dgroups=ensure_container(destr,'selectionEntryGroups')
          if any(g.attrib.get('id')=='destroyer-transport' for g in dgroups.findall(q('selectionEntryGroup'))):
              raise SystemExit('Destroyer transport group already exists')
          dg=ET.SubElement(dgroups,q('selectionEntryGroup'),{'name':'Dedicated Transport','id':'destroyer-transport','hidden':'false'})
          constraint(dg,'destroyer-transport-max')
          entrylink(dg,'Rhino','destroyer-tr-rhino','transport-rhino')
          entrylink(dg,'Drop Pod','destroyer-tr-pod','transport-drop-pod')
          entrylink(dg,'Dreadclaw Drop Pod','destroyer-tr-dc','transport-dreadclaw')
          add_hide_when_selected(dg,'destroyer-transport-max','destroyer-jump-packs')

          # Revision bump and refresh.
          root.attrib['revision']='17'
          root.attrib['gameSystemRevision']='7'
          comment=root.find(q('comment'))
          comment.text='Revision 17: Cleaned the Elites transport selectors: Veteran, Terminator and Destroyer squads now each show only their own legal transport options once, while continuing to reuse the shared transport entries.'
          readme=root.find(q('readme'))
          readme.text='Core Troops and Elites entries follow the current Legiones Astartes Army List. Shared weapons and transports are reused through links rather than duplicated. Unit-specific replacements take precedence over generic Armoury access, squad-wide upgrades suppress redundant character purchases where practical, and items may not be selected more than once unless specifically permitted.'

          tree.write(CAT,encoding='UTF-8',xml_declaration=True)

          gtext=GST.read_text(encoding='utf-8')
          if 'revision="6"' not in gtext: raise SystemExit('Expected game system revision 6')
          gtext=gtext.replace('revision="6"','revision="7"',1)
          GST.write_text(gtext,encoding='utf-8')

          # Validation: XML parses, IDs unique, and no duplicate direct names/targets in any selection group.
          ET.parse(CAT); ET.parse(GST)
          r=ET.parse(CAT).getroot()
          ids=Counter(e.attrib['id'] for e in r.iter() if 'id' in e.attrib)
          dupids=[k for k,v in ids.items() if v>1]
          if dupids: raise SystemExit('Duplicate XML IDs: '+repr(dupids[:20]))
          issues=[]
          for g in r.iter(q('selectionEntryGroup')):
              direct=[]
              for ctag in ('entryLinks','selectionEntries','selectionEntryGroups'):
                  c=g.find(q(ctag))
                  if c is not None:
                      for ch in list(c): direct.append((ch.attrib.get('name',''),ch.attrib.get('targetId','')))
              names=Counter(n for n,t in direct if n)
              targets=Counter(t for n,t in direct if t)
              dn=[n for n,c in names.items() if c>1]
              dt=[t for t,c in targets.items() if c>1]
              if dn or dt: issues.append((g.attrib.get('id'),dn,dt))
          if issues: raise SystemExit('Duplicate direct options remain: '+repr(issues[:20]))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Legiones Astartes.cat" "Prohammer 30k.gst"
          git commit -m "Clean Elite transport selectors revision 17 [skip ci]"
          git push
