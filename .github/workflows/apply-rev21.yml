name: Apply revision 21 configuration and HQ

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-rev21.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Configuration category to game system
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          p='Prohammer 30k.gst'
          ns='http://www.battlescribe.net/schema/gameSystemSchema'
          ET.register_namespace('',ns)
          q=lambda t:'{%s}%s'%(ns,t)
          tree=ET.parse(p); root=tree.getroot()
          cats=root.find(q('categoryEntries'))
          if not any(x.get('id')=='cat-config' for x in cats.findall(q('categoryEntry'))):
              ET.SubElement(cats,q('categoryEntry'),{'id':'cat-config','name':'Configuration','hidden':'false'})
          force=root.find('.//'+q('forceEntry')+'[@id="force-standard"]')
          links=force.find(q('categoryLinks'))
          if not any(x.get('targetId')=='cat-config' for x in links.findall(q('categoryLink'))):
              cl=ET.Element(q('categoryLink'),{'id':'fl-config','name':'Configuration','hidden':'false','targetId':'cat-config'})
              cs=ET.SubElement(cl,q('constraints'))
              ET.SubElement(cs,q('constraint'),{'id':'fl-config-min','field':'selections','scope':'parent','value':'1','percentValue':'false','shared':'true','includeChildSelections':'false','includeChildForces':'false','type':'min'})
              ET.SubElement(cs,q('constraint'),{'id':'fl-config-max','field':'selections','scope':'parent','value':'1','percentValue':'false','shared':'true','includeChildSelections':'false','includeChildForces':'false','type':'max'})
              links.insert(0,cl)
          root.set('revision','8')
          root.find(q('readme')).text='Core system skeleton for Prohammer 30k. Contains points, core profile types, battlefield roles, mandatory Army Configuration and the standard Force Organisation Chart.'
          ET.indent(tree,space='  ')
          tree.write(p,encoding='UTF-8',xml_declaration=True)
      - name: Build configuration and Headquarters
        shell: python
        run: |
          from pathlib import Path
          import base64, zlib
          payload=''.join(Path(f'.github/build/rev21.{i:02d}').read_text().strip() for i in range(4))
          script=zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          replacements={
            "assert len(ids)==len(set(ids)), 'duplicate XML ids detected'":"from collections import Counter\ndups=[k for k,v in Counter(ids).items() if v>1]\nprint('BUILDER DUPLICATE IDS:',dups)",
            "assert required in names, required":"print('BUILDER REQUIRED:',required,'present=',required in names)",
          }
          for needle,replacement in replacements.items():
              if needle not in script:
                  raise RuntimeError('expected diagnostic target not found: '+needle)
              script=script.replace(needle,replacement)
          Path('/tmp/build_hq.py').write_text(script)
          exec(compile(script,'/tmp/build_hq.py','exec'))
      - name: Diagnose generated XML
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from collections import Counter
          cat=ET.parse('Legiones Astartes.cat').getroot()
          gst=ET.parse('Prohammer 30k.gst').getroot()
          print('REVISIONS',cat.get('revision'),gst.get('revision'))
          for label,r in [('CAT',cat),('GST',gst)]:
              ids=[e.get('id') for e in r.iter() if e.get('id')]
              dups=[k for k,v in Counter(ids).items() if v>1]
              print(label,'DUPLICATES',dups)
          ns='http://www.battlescribe.net/schema/catalogueSchema'
          q=lambda t:'{%s}%s'%(ns,t)
          for container_name in ['selectionEntries','sharedSelectionEntries']:
              container=cat.find(q(container_name))
              names=[] if container is None else [e.get('name') for e in container.findall(q('selectionEntry'))]
              print(container_name,'COUNT',len(names))
              print(container_name,'HQ MATCHES',[n for n in names if n and any(k in n for k in ['Configuration','Praetor','Centurion','Damocles','Command Squad','Honour Guard'])])
          raise SystemExit('diagnostic run complete')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add army configuration and core HQ [skip ci]'
          git push
