name: Apply rev12 Assault Sergeant cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch catalogue
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          p = Path('Legiones Astartes.cat')
          s = p.read_text(encoding='utf-8')

          if 'revision="12"' in s:
              raise SystemExit(0)
          if 'revision="11"' not in s:
              raise RuntimeError('Expected catalogue revision 11')

          s = s.replace('revision="11"', 'revision="12"', 1)
          s = re.sub(r'<comment>Revision 11:.*?</comment>',
                     '<comment>Revision 12: Cleaned Legion Assault Sergeant duplicate weapon and wargear options; unit-specific replacements now take precedence over duplicate Armoury entries.</comment>',
                     s, count=1, flags=re.S)
          s = re.sub(r'<readme>.*?</readme>',
                     '<readme>The Legion Tactical Squad and Legion Assault Squad follow the current Legiones Astartes Army List. Squad Sergeants may not select the same item more than once unless a unit entry specifically permits it. Assault Sergeant weapons already available as unit-specific replacements are not repeated in his additional Armoury; squad-wide Combat Shields and Melta Bombs also prevent buying the same item again for the Sergeant.</readme>',
                     s, count=1, flags=re.S)

          old_rule = ('The Sergeant may select up to 50 points of additional permitted weapons and wargear from the Space Marine Armoury. '
                      'Only items marked for Squad Sergeants are available. The Sergeant may carry no more than two weapons, only one of which may be two-handed. '
                      'A pair of Lightning Claws counts as both weapon choices. Unit-specific replacement options are available at the points costs shown in this squad entry.')
          new_rule = ('The Sergeant may select up to 50 points of additional permitted weapons and wargear from the Space Marine Armoury. '
                      'Only items marked for Squad Sergeants are available. The Sergeant may carry no more than two weapons, only one of which may be two-handed. '
                      'A pair of Lightning Claws counts as both weapon choices. No item may be selected more than once unless a unit entry specifically permits otherwise. '
                      'Unit-specific replacement options are available at the points costs shown in this squad entry and are not repeated in the additional Armoury.')
          if old_rule not in s:
              raise RuntimeError('Assault Sergeant rule text not found')
          s = s.replace(old_rule, new_rule, 1)

          # Every Sergeant-legal single-handed Armoury weapon is already present as a cheaper or equal
          # unit-specific Assault Sergeant replacement. Remove the duplicate Armoury block entirely.
          pattern = r'\n\s*<selectionEntryGroup name="Single-Handed Weapons" id="assault-sgt-armoury-single" hidden="false">.*?</selectionEntryGroup>'
          s, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError(f'Expected one Assault Sergeant single-handed Armoury block, removed {n}')

          s = s.replace(
              '<selectionEntryGroup name="Armoury Weapons" id="assault-sgt-armoury-weapons" hidden="false">\n                  <constraints><constraint type="max" value="2" field="selections" scope="parent" shared="true" id="assault-sgt-armoury-weapons-max" includeChildSelections="true"/></constraints>',
              '<selectionEntryGroup name="Additional Armoury Weapon" id="assault-sgt-armoury-weapons" hidden="false">\n                  <constraints><constraint type="max" value="1" field="selections" scope="parent" shared="true" id="assault-sgt-armoury-weapons-max" includeChildSelections="true"/></constraints>',
              1)

          old_shield = '<entryLink import="true" name="Combat Shield" hidden="false" id="assault-sgt-shield" type="selectionEntry" targetId="gear-combat-shield"><constraints><constraint type="max" value="1" field="selections" scope="parent" shared="true" id="assault-sgt-shield-max" includeChildSelections="false"/></constraints><costs><cost name="Points" typeId="pts" value="5"/></costs></entryLink>'
          new_shield = '<entryLink import="true" name="Combat Shield" hidden="false" id="assault-sgt-shield" type="selectionEntry" targetId="gear-combat-shield"><constraints><constraint type="max" value="1" field="selections" scope="parent" shared="true" id="assault-sgt-shield-max" includeChildSelections="false"/></constraints><modifiers><modifier type="set" value="true" field="hidden"><conditions><condition type="atLeast" value="1" field="selections" scope="root-entry" childId="assault-squad-shields" shared="true" includeChildSelections="true"/></conditions></modifier><modifier type="set" value="0" field="assault-sgt-shield-max"><conditions><condition type="atLeast" value="1" field="selections" scope="root-entry" childId="assault-squad-shields" shared="true" includeChildSelections="true"/></conditions></modifier></modifiers><costs><cost name="Points" typeId="pts" value="5"/></costs></entryLink>'
          if old_shield not in s:
              raise RuntimeError('Assault Sergeant Combat Shield entry not found')
          s = s.replace(old_shield, new_shield, 1)

          old_melta = '<entryLink import="true" name="Melta Bombs" hidden="false" id="assault-sgt-melta-bombs" type="selectionEntry" targetId="gear-melta-bombs"><constraints><constraint type="max" value="1" field="selections" scope="parent" shared="true" id="assault-sgt-melta-bombs-max" includeChildSelections="false"/></constraints><costs><cost name="Points" typeId="pts" value="5"/></costs></entryLink>'
          new_melta = '<entryLink import="true" name="Melta Bombs" hidden="false" id="assault-sgt-melta-bombs" type="selectionEntry" targetId="gear-melta-bombs"><constraints><constraint type="max" value="1" field="selections" scope="parent" shared="true" id="assault-sgt-melta-bombs-max" includeChildSelections="false"/></constraints><modifiers><modifier type="set" value="true" field="hidden"><conditions><condition type="atLeast" value="1" field="selections" scope="root-entry" childId="assault-squad-melta-bombs" shared="true" includeChildSelections="true"/></conditions></modifier><modifier type="set" value="0" field="assault-sgt-melta-bombs-max"><conditions><condition type="atLeast" value="1" field="selections" scope="root-entry" childId="assault-squad-melta-bombs" shared="true" includeChildSelections="true"/></conditions></modifier></modifiers><costs><cost name="Points" typeId="pts" value="5"/></costs></entryLink>'
          if old_melta not in s:
              raise RuntimeError('Assault Sergeant Melta Bombs entry not found')
          s = s.replace(old_melta, new_melta, 1)

          assert 'id="assault-sgt-armoury-single"' not in s
          assert 'id="assault-sgt-arm-hf"' not in s
          assert 'id="assault-sgt-arm-lc"' not in s
          assert 'id="assault-sgt-arm-pp"' not in s
          assert 'id="assault-sgt-arm-pf"' not in s
          assert 'id="assault-sgt-arm-pw"' not in s
          assert 'id="assault-sgt-arm-rw"' not in s
          assert 'id="assault-sgt-arm-th"' not in s
          assert 'id="assault-sgt-arm-vs"' not in s
          assert 'childId="assault-squad-shields"' in s
          assert 'childId="assault-squad-melta-bombs"' in s

          p.write_text(s, encoding='utf-8')
          ET.parse(p)
      - name: Commit catalogue
        run: |
          if git diff --quiet -- 'Legiones Astartes.cat'; then exit 0; fi
          git config user.name 'Azubi1234'
          git config user.email '132048044+Azubi1234@users.noreply.github.com'
          git add 'Legiones Astartes.cat'
          git commit -m 'Clean Assault Sergeant duplicate options'
          git push
