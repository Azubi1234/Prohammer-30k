name: Apply rev14 Recon Squad
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Legion Reconnaissance Squad
        env:
          PATCH_B64: "  "
        run: |
          python3 - <<'PY'
          import base64, os
          code = base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
          exec(compile(code, 'rev14_recon.py', 'exec'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Legiones Astartes.cat"
          git commit -m "Add Legion Reconnaissance Squad revision 14"
          git push
