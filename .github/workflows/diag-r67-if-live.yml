name: Diagnose Revision 67 Imperial Fists live data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build/diag_r67_if_live.py'
      - '.github/workflows/diag-r67-if-live.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r67_if_live.py
