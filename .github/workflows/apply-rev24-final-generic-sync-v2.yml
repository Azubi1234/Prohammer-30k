name: Apply revision 24 final generic sync v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-rev24-final-generic-sync-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final generic army-list changes
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from collections import Counter

          CAT='Legiones Astartes.cat'
          NS='http://www.battlescribe.net/schema/catalogueSchema'
          ET.register_namespace('',NS)
          q=lambda t:f'{{{NS}}}{t}'
          tree=ET.parse(CAT); root=tree.getroot()

          def byid(i): return next((e for e in root.iter() if e.get('id')==i),None)
          def ensure(p,t):
              e=p.find(q(t))
              if e is None: e=ET.SubElement(p,q(t))
              return e
          def parent_map(): return {c:p for p in root.iter() for c in p}
          def remove_id(i):
              e=byid(i)
              if e is None: return
              p=parent_map().get(e)
              if p is not None: p.remove(e)

          # Shared Refractor Field text from the final generic army list.
          rf=byid('gear-hq-refractor'); assert rf is not None
          rr=byid('gear-hq-refractor-rule')
          if rr is None:
              rr=ET.SubElement(ensure(rf,'rules'),q('rule'),{'name':'Refractor Field','id':'gear-hq-refractor-rule','hidden':'false'})
          rd=rr.find(q('description'))
          if rd is None: rd=ET.SubElement(rr,q('description'))
          rd.text=('A Refractor Field grants a 5+ Invulnerable Save. '
                   'A Sergeant may only purchase a Refractor Field if his squad is purchased at its maximum starting strength. '
                   'A model that already has a 5+ or better Invulnerable Save may not purchase a Refractor Field.')

          # Correct generic Armoury access.
          remove_id('hq-praetor-wg-2')            # Praetor: no Refractor Field purchase
          remove_id('terminator-sgt-refractor')   # TDA Sergeant: no Refractor Field purchase

          # Centurion may buy it, but not while already carrying a 5++ or better source.
          cent=byid('hq-centurion'); cent_rf=byid('hq-centurion-wg-2')
          assert cent is not None and cent_rf is not None
          mods=ensure(cent_rf,'modifiers')
          for m in list(mods.findall(q('modifier'))):
              if (m.get('id') or '').startswith('rev24-cent-rf-'): mods.remove(m)
          blockers=[]
          for e in cent.iter():
              if e is cent_rf: continue
              if (e.get('name') or '') in {'Terminator Armour','Tartaros Terminator Armour','Cataphractii Terminator Armour','Iron Halo','Boarding Shield'} and e.get('id'):
                  blockers.append(e.get('id'))
          if byid('hq-consul-chaplain') is not None: blockers.append('hq-consul-chaplain')
          for n,cid in enumerate(dict.fromkeys(blockers),1):
              m=ET.SubElement(mods,q('modifier'),{'id':f'rev24-cent-rf-{n}','type':'set','value':'true','field':'hidden'})
              cs=ET.SubElement(m,q('conditions'))
              ET.SubElement(cs,q('condition'),{'type':'atLeast','value':'1','field':'selections','scope':'root-entry','childId':cid,'shared':'true','includeChildSelections':'true','includeChildForces':'false'})

          # Add/gate Refractor Field for all ordinary Power Armour Sergeants.
          # Breachers are excluded because their Boarding Shield already gives a 5++.
          targets=[
              'Legion Veteran Squad','Legion Tactical Squad','Legion Assault Squad','Legion Destroyer Squad',
              'Legion Reconnaissance Squad','Legion Seeker Squad','Legion Bike Squadron',
              'Legion Sky Hunter Jetbike Squadron','Legion Heavy Support Squad'
          ]
          def find_unit(name):
              nl=name.lower()
              xs=[e for e in root.iter(q('selectionEntry')) if e.get('type')=='unit' and (e.get('name') or '').strip().lower()==nl]
              if xs: return xs[0]
              xs=[e for e in root.iter(q('selectionEntry')) if e.get('type')=='unit' and nl in (e.get('name') or '').lower()]
              return xs[0] if xs else None
          def find_armoury(unit):
              gs=[g for g in unit.iter(q('selectionEntryGroup')) if 'sergeant armoury' in (g.get('name') or '').lower()]
              return gs[0] if gs else None
          def find_size_selector(unit):
              cand=[]
              for e in unit.iter(q('selectionEntry')):
                  if 'sergeant' in (e.get('name') or '').lower(): continue
                  for c in e.findall('./'+q('constraints')+'/'+q('constraint')):
                      if c.get('type')=='max' and c.get('field')=='selections':
                          try: v=float(c.get('value'))
                          except: continue
                          if v>1: cand.append((v,e))
              cand.sort(key=lambda x:x[0],reverse=True)
              return cand[0] if cand else (None,None)

          gated=[]
          for name in targets:
              unit=find_unit(name); assert unit is not None,name
              arm=find_armoury(unit); assert arm is not None,'armoury '+name
              maxv,sel=find_size_selector(unit); assert sel is not None,'size '+name
              opt=next((e for e in arm.iter() if (e.get('name') or '')=='Refractor Field' and e.tag in (q('entryLink'),q('selectionEntry'))),None)
              if opt is None:
                  oid='rev24-'+unit.get('id')+'-sgt-refractor'
                  opt=ET.SubElement(ensure(arm,'entryLinks'),q('entryLink'),{'import':'true','name':'Refractor Field','hidden':'false','id':oid,'type':'selectionEntry','targetId':'gear-hq-refractor'})
                  cs=ET.SubElement(opt,q('constraints'))
                  ET.SubElement(cs,q('constraint'),{'id':oid+'-max','field':'selections','scope':'parent','value':'1','percentValue':'false','shared':'true','includeChildSelections':'false','includeChildForces':'false','type':'max'})
                  costs=ET.SubElement(opt,q('costs'))
                  ET.SubElement(costs,q('cost'),{'name':'Points','typeId':'pts','value':'15'})
              om=ensure(opt,'modifiers')
              for m in list(om.findall(q('modifier'))):
                  if (m.get('id') or '').startswith('rev24-rf-max-'): om.remove(m)
              m=ET.SubElement(om,q('modifier'),{'id':'rev24-rf-max-'+unit.get('id'),'type':'set','value':'true','field':'hidden'})
              cs=ET.SubElement(m,q('conditions'))
              ET.SubElement(cs,q('condition'),{'type':'lessThan','value':str(int(maxv)),'field':'selections','scope':'root-entry','childId':sel.get('id'),'shared':'true','includeChildSelections':'false','includeChildForces':'false'})
              gated.append((name,sel.get('name'),sel.get('id'),int(maxv)))

          # Correct final Rite text.
          recon=byid('rite-recon-rule'); assert recon is not None
          d=recon.find(q('description'))
          if d is None: d=ET.SubElement(recon,q('description'))
          d.text=('Effects — compulsory Troops must be Legion Reconnaissance Squads. Units in this army which possess Infiltrate may use it even if the mission would not normally permit Infiltrators. '
                  'Any model in a Legion Veteran Squad may replace its bolter, or both its bolt pistol and close-combat weapon, with a Sniper Rifle for +5 points. '
                  'A unit which deployed using Infiltrate or made a pre-game Scout move improves any Cover Save it receives by +1 during the first game turn, to a maximum of 3+. '
                  'Limitations — no model in the army may be equipped with Terminator Armour or Cataphractii Terminator Armour. All Heavy Support choices must begin the battle in Reserve and enter play using the normal Reserve rules.')

          sky=byid('rite-skyhunter-rule'); assert sky is not None
          d=sky.find(q('description'))
          if d is None: d=ET.SubElement(sky,q('description'))
          d.text=('Effects — Legion Sky Hunter Jetbike Squadrons may be selected as Troops choices. The army’s compulsory Troops choices must be Legion Sky Hunter Jetbike Squadrons. These units do not also occupy a Fast Attack choice. '
                  'An Independent Character equipped with a Space Marine Bike may upgrade it to a Jetbike for an additional +5 points and follows the normal rules for Jetbikes. '
                  'Once per battle, each Legion Sky Hunter Jetbike Squadron may voluntarily leave the battlefield by moving completely off a table edge, entering Ongoing Reserves and returning during the controlling player’s following turn using the normal Outflank rules. '
                  'Limitations — at least one Independent Character in the army must be mounted on a Jetbike. The army may not include Castraferrum or Contemptor Dreadnoughts. The army may include no more than one Heavy Support choice.')

          root.set('revision','24')
          comment=root.find(q('comment'))
          if comment is None: comment=ET.SubElement(root,q('comment'))
          comment.text='Revision 24: Synced final generic Army List corrections: centralized Refractor Field restrictions and corrected Recon Company and Sky Hunter Phalanx.'
          readme=root.find(q('readme'))
          if readme is None: readme=ET.SubElement(root,q('readme'))
          note=' Revision 24 syncs the final generic Army List Refractor Field restrictions and corrected Recon Company/Sky Hunter Phalanx rules.'
          if note.strip() not in (readme.text or ''): readme.text=(readme.text or '')+note

          ET.indent(tree,space='  '); tree.write(CAT,encoding='UTF-8',xml_declaration=True)

          # Validate resulting catalogue.
          rr=ET.parse(CAT).getroot()
          ids=[e.get('id') for e in rr.iter() if e.get('id')]
          dup=[k for k,v in Counter(ids).items() if v>1]
          assert not dup,dup[:20]
          assert rr.get('revision')=='24'
          assert byid('hq-praetor-wg-2') is None
          assert byid('terminator-sgt-refractor') is None
          assert 'maximum starting strength' in (byid('gear-hq-refractor-rule').find(q('description')).text or '')
          assert 'Legion Reconnaissance Squads' in (byid('rite-recon-rule').find(q('description')).text or '')
          assert 'Legion Sky Hunter Jetbike Squadrons' in (byid('rite-skyhunter-rule').find(q('description')).text or '')
          print('Revision 24 validated')
          for x in gated: print(x)

      - name: Commit revision 24
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Legiones Astartes.cat'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync final generic army-list corrections [skip ci]'
          git push
